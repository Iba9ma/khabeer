<title>منصة خبير</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* الفكرة: ثلاث بوابات (عميل / محامٍ / إدارة) فوق بيانات واحدة — هوية كحلية رسمية بلمسة ورق قانوني.
   وضعان فاتح وداكن: يتبع إعداد الجهاز افتراضياً، وزر في الشريط العلوي يحفظ اختيار المستخدم. */
:root{
  color-scheme:light;
  --line2:#cdd5e3;--soft:#f3f5fa;--ink2:#334155;--accent-ink:#1e3a8a;--toast-bg:#101828;
  --warn-line:#f5d18a;--warn-ink:#7a4504;--info-ink:#1e3a8a;--ok-line:#9be3c4;--ok-ink:#065f46;--err-line:#f6b4b4;--err-ink:#991b1b;
  --st-review-bg:#fdf0cf;--st-review:#8a4b05;--st-prog:#1d3fa8;--st-ready-bg:#d6f5e6;--st-ready:#0b6b4a;--st-closed-bg:#e6eaf1;--st-cancel-bg:#fde1e1;--st-cancel:#9b1c1c;
  --avatar-bg:#e8eefc;--hover-line:#9db8f5;
  --navy:#1e3a8a;--navy-ink:#172554;--blue:#2563eb;--blue-50:#eef4ff;--blue-100:#dbe7ff;
  --green:#0f9f6e;--green-50:#ecfdf5;--red:#d42c2c;--red-50:#fef2f2;--amber:#b86e04;--amber-50:#fff8eb;
  --ink:#101828;--muted:#5b6478;--line:#e2e7f0;--canvas:#f4f6fb;--surface:#ffffff;--paper:#fbfaf6;
  --violet:#6d28d9;--violet-50:#f7f3ff;
  --font:'Tajawal',system-ui,'Segoe UI',Tahoma,sans-serif;
  --mono:Consolas,'Courier New',monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --blue:#3b82f6;--blue-50:#16213d;--blue-100:#1e2e55;
  --green-50:#0f2a22;--red-50:#331a1d;--amber-50:#33270f;--violet-50:#231b3a;--violet:#a78bfa;
  --ink:#e6eaf2;--ink2:#cbd3e1;--muted:#9aa6bd;--line:#2a3550;--line2:#3a4766;--canvas:#0b1120;--surface:#141c2f;--paper:#182238;--soft:#1a2338;
  --accent-ink:#9db8f5;--toast-bg:#26324d;
  --warn-line:#6b4a12;--warn-ink:#f6cf7f;--info-ink:#bcd0fb;--ok-line:#1e5c45;--ok-ink:#86e0b9;--err-line:#6b2a2a;--err-ink:#f6a5a5;
  --st-review-bg:#3a2c0e;--st-review:#f6cf7f;--st-prog:#bcd0fb;--st-ready-bg:#0f3326;--st-ready:#86e0b9;--st-closed-bg:#253049;--st-cancel-bg:#3a1a1c;--st-cancel:#f6a5a5;
  --avatar-bg:#25335a;--hover-line:#4a6fc0;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --blue:#3b82f6;--blue-50:#16213d;--blue-100:#1e2e55;
  --green-50:#0f2a22;--red-50:#331a1d;--amber-50:#33270f;--violet-50:#231b3a;--violet:#a78bfa;
  --ink:#e6eaf2;--ink2:#cbd3e1;--muted:#9aa6bd;--line:#2a3550;--line2:#3a4766;--canvas:#0b1120;--surface:#141c2f;--paper:#182238;--soft:#1a2338;
  --accent-ink:#9db8f5;--toast-bg:#26324d;
  --warn-line:#6b4a12;--warn-ink:#f6cf7f;--info-ink:#bcd0fb;--ok-line:#1e5c45;--ok-ink:#86e0b9;--err-line:#6b2a2a;--err-ink:#f6a5a5;
  --st-review-bg:#3a2c0e;--st-review:#f6cf7f;--st-prog:#bcd0fb;--st-ready-bg:#0f3326;--st-ready:#86e0b9;--st-closed-bg:#253049;--st-cancel-bg:#3a1a1c;--st-cancel:#f6a5a5;
  --avatar-bg:#25335a;--hover-line:#4a6fc0;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--font);font-size:14.5px;line-height:1.65}
body{direction:rtl}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:90;background:var(--navy-ink)}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1,h2,h3{text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.demobar{background:var(--navy-ink);color:#c7d2fe;font-size:12.5px}
.demobar .in{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:7px;max-width:1280px;margin:0 auto}
.demobar .lbl{font-weight:700;letter-spacing:.02em}
.seg{display:flex;background:rgba(255,255,255,.1);border-radius:10px;padding:3px;gap:2px}
.seg button{background:none;border:0;color:#c7d2fe;padding:5px 12px;border-radius:8px;font-weight:700;font-size:12.5px}
.seg button.on{background:#fff;color:#1e3a8a}
.demobar .clock{margin-inline-start:auto;color:#a5b4fc}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.card h3{margin:0 0 10px;font-size:15.5px}
.card h4{margin:0 0 8px;font-size:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.btn{border:0;border-radius:10px;padding:9px 16px;font-weight:700;background:var(--blue);color:#fff;transition:filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn.block{width:100%;padding:12px}
.btn.lg{padding:13px 22px;font-size:15.5px}
.btn.ghost{background:var(--surface);color:var(--blue);border:1px solid var(--blue-100)}
.btn.green{background:var(--green)}
.btn.red{background:var(--red)}
.btn.dark{background:var(--navy)}
.btn.light{background:var(--surface);color:var(--accent-ink)}
.btn.sm{padding:5px 11px;font-size:12.5px;border-radius:8px}
.btn.danger-ghost{background:var(--surface);color:var(--red);border:1px solid var(--err-line)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;border:1px solid var(--line2);border-radius:10px;padding:9px 11px;background:var(--surface)}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue-100);border-color:var(--blue)}
label.f{display:block;font-weight:700;font-size:12.5px;margin:10px 0 4px}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:700;white-space:nowrap}
.st-draft{background:var(--soft);color:var(--muted);border:1px dashed #94a3b8}
.st-review{background:var(--st-review-bg);color:var(--st-review)}
.st-progress{background:var(--blue-100);color:var(--st-prog)}
.st-ready{background:var(--st-ready-bg);color:var(--st-ready)}
.st-closed{background:var(--st-closed-bg);color:var(--ink2)}
.st-cancel{background:var(--st-cancel-bg);color:var(--st-cancel)}
.tag{display:inline-block;font-size:12.5px;padding:1px 8px;border-radius:6px;background:var(--soft);color:var(--muted);font-weight:700;white-space:nowrap}
.tag.red{background:var(--red-50);color:var(--red)}
.tag.amber{background:var(--amber-50);color:var(--amber)}
.tag.blue{background:var(--blue-50);color:var(--blue)}
.tag.green{background:var(--green-50);color:var(--green)}
.tag.violet{background:var(--violet-50);color:var(--violet)}
.banner{border-radius:12px;padding:10px 14px;font-size:13px}
.banner.warn{background:var(--amber-50);border:1px solid var(--warn-line);color:var(--warn-ink)}
.banner.info{background:var(--blue-50);border:1px solid var(--blue-100);color:var(--info-ink)}
.banner.ok{background:var(--green-50);border:1px solid var(--ok-line);color:var(--ok-ink)}
.banner.err{background:var(--red-50);border:1px solid var(--err-line);color:var(--err-ink)}
.kv{display:grid;grid-template-columns:120px 1fr;gap:5px 12px;font-size:13.5px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 10px;text-align:center;font-weight:700}
.choice:hover{border-color:var(--blue);background:var(--blue-50)}
.choice .cic{font-size:24px;display:block}
.choice small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.choice.wide{grid-column:1/-1;border-style:dashed;border-color:var(--hover-line);background:var(--blue-50)}
.steps{display:flex;gap:5px}
.steps div{flex:1;height:5px;border-radius:4px;background:var(--line)}
.steps div.on{background:var(--blue)}
.qa{font-size:13px;border-bottom:1px dashed var(--line);padding:7px 0;display:flex;gap:8px;align-items:flex-start}
.qa .q{color:var(--muted);flex:1;min-width:0}
.qa .a{font-weight:700}
.qbox{background:var(--surface);border:2px solid var(--blue-100);border-radius:14px;padding:16px}
.qbox .qt{font-weight:800;font-size:16px;margin-bottom:12px}
.opts{display:flex;flex-direction:column;gap:7px}
.opts button{background:var(--surface);border:1px solid var(--line2);border-radius:10px;padding:11px 12px;text-align:right;font-weight:600}
.opts button:hover{border-color:var(--blue);background:var(--blue-50)}
.timeline{display:flex;justify-content:space-between;position:relative}
.timeline:before{content:"";position:absolute;top:10px;right:9%;left:9%;height:2px;background:var(--line)}
.timeline div{flex:1;text-align:center;font-size:12.5px;color:var(--muted);position:relative}
.timeline div b{display:block;width:22px;height:22px;border-radius:50%;background:var(--line2);margin:0 auto 4px;color:#fff;font-size:12.5px;line-height:22px}
.timeline div.done b{background:var(--green)}
.timeline div.cur b{background:var(--blue);box-shadow:0 0 0 4px var(--blue-100)}
.timeline div.cur{color:var(--blue);font-weight:700}
.req{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;background:var(--surface)}
.req.team{border-color:var(--blue-100);background:var(--blue-50)}
.req .meta{font-size:12.5px;color:var(--muted)}
.req .reply{margin-top:6px;padding:6px 9px;background:var(--soft);border-radius:8px;border-right:3px solid var(--green)}
.files{list-style:none;padding:0;margin:0}
.files li{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;padding:7px 0;border-bottom:1px dashed var(--line)}
.files li span:first-child{min-width:0;overflow-wrap:anywhere}
.contract{border:1.5px solid var(--navy);border-radius:14px;padding:16px;background:var(--paper)}
.contract .hd{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:10px}
.contract .total{font-size:22px;font-weight:800;color:var(--accent-ink)}
.pay-opts{display:flex;gap:8px;margin:10px 0}
.pay-opts label{flex:1;border:1px solid var(--line2);border-radius:10px;padding:10px 4px;text-align:center;font-weight:800;cursor:pointer;background:var(--surface);position:relative}
.pay-opts input{position:absolute;opacity:0;pointer-events:none}
.pay-opts label:has(input:checked){border-color:var(--blue);background:var(--blue-50);color:var(--blue)}
.empty{text-align:center;color:var(--muted);padding:36px 12px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.kpi b{display:block;font-size:24px;color:var(--accent-ink);font-variant-numeric:tabular-nums;line-height:1.3}
.kpi span{font-size:12.5px;color:var(--muted)}
.kpi.alert{border-color:var(--err-line);background:var(--red-50)}
.kpi.alert b{color:var(--red)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:700;color:var(--ink2)}
.chips button.on{background:var(--navy);color:#fff;border-color:var(--accent-ink)}
.t-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.t{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
table.t th{background:var(--soft);text-align:right;padding:9px 12px;font-size:12.5px;color:var(--ink2);border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--blue-50)}
table.t tr.late td{background:var(--red-50)}
table.t td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.ai{border:1px dashed var(--violet);background:var(--violet-50);border-radius:14px;padding:14px}
.ai h4{color:var(--violet);margin:0 0 6px}
.mark{background:#fff;color:#1e3a8a;border-radius:9px;width:34px;height:34px;display:grid;place-items:center;font-weight:800;font-size:18px;flex:none}
.bell{position:relative}
.bell i{position:absolute;top:-5px;left:-7px;background:var(--red);color:#fff;font-style:normal;font-size:12.5px;border-radius:9px;padding:0 5px;min-width:17px;line-height:16px;text-align:center}

.site-h{background:var(--navy);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:40;box-shadow:0 2px 10px rgba(16,24,40,.12)}
.site-h .in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:18px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none}
.brand b{display:block;font-size:19px;line-height:1.1}
.brand small{display:block;font-size:12.5px;color:#a9c0f5}
.site-nav{display:flex;gap:4px}
.site-nav button{background:none;border:0;color:#c9d7fb;padding:7px 12px;border-radius:9px;font-weight:700}
.site-nav button:hover{background:rgba(255,255,255,.08)}
.site-nav button.on{background:rgba(255,255,255,.14);color:#fff}
.site-tools{margin-inline-start:auto;display:flex;align-items:center;gap:8px}
.icon-btn{background:rgba(255,255,255,.1);border:0;color:#fff;border-radius:10px;padding:7px 11px;font-weight:700;font-size:13px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--avatar-bg);color:var(--accent-ink);display:grid;place-items:center;font-weight:800}
.site-main .in{max-width:1080px;margin:0 auto;padding-block:22px 40px}
.hero{background:linear-gradient(160deg,var(--navy) 0%,#2449b5 100%);color:#fff;border-radius:20px;padding:30px;display:grid;grid-template-columns:1.25fr 1fr;gap:28px;align-items:center}
.hero h1{font-size:30px;line-height:1.3;margin:0 0 10px;font-weight:800}
.hero p{color:#d6e2ff;margin:0 0 18px;max-width:48ch}
.how{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:s}
.how li{counter-increment:s;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:10px 12px;display:flex;gap:12px;align-items:center}
.how li:before{content:counter(s);width:28px;height:28px;border-radius:50%;background:#fff;color:#1e3a8a;font-weight:800;display:grid;place-items:center;flex:none}
.how b{display:block}
.how span{font-size:12.5px;color:#c9d7fb}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:26px 0 12px}
.sec-h h2{margin:0;font-size:19px}
.ogrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.ocard{display:flex;flex-direction:column;gap:6px;width:100%;text-align:right;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.ocard:hover{border-color:var(--hover-line)}
.narrow{max-width:700px;margin:0 auto}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:16px;align-items:start}
.draft-bar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:5}
.bnav{display:none}
.push{position:fixed;top:calc(env(safe-area-inset-top,0px) + 70px);left:max(16px,env(safe-area-inset-left,0px));width:min(360px,calc(100% - 32px));background:var(--toast-bg);color:#fff;border-radius:14px;padding:11px 14px;font-size:13px;box-shadow:0 10px 26px rgba(0,0,0,.25);z-index:80;cursor:pointer;animation:drop .3s ease}
.push small{display:block;color:#94a3b8;font-size:12.5px}
@keyframes drop{from{transform:translateY(-14px);opacity:0}to{transform:none;opacity:1}}

.con{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100vh - 40px)}
.con-side{background:#0e1630;color:#c5cde0;padding:16px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
.con-side.lawyer{background:#13241f}
.con-brand{display:flex;gap:10px;align-items:center;padding:4px 6px 14px}
.con-brand b{color:#fff;display:block;font-size:17px;line-height:1.1}
.con-brand small{font-size:12.5px;color:#8fa0c4}
.who{background:rgba(255,255,255,.06);border-radius:12px;padding:10px;margin-bottom:10px}
.who label{display:block;font-size:12.5px;color:#8fa0c4;margin-bottom:4px}
.who select{background:#0b1226;color:#fff;border-color:#2c3a5e;font-size:13px;padding:6px}
.con-side.lawyer .who select{background:#0d1a16;border-color:#2b4a40}
.who .role{font-size:12.5px;color:#9db8f5;margin-top:6px}
.con-side.lawyer .who .role{color:#7fd8b5}
.con-nav{display:flex;flex-direction:column;gap:2px}
.con-nav button{background:none;border:0;color:#c5cde0;text-align:right;padding:9px 10px;border-radius:9px;display:flex;justify-content:space-between;align-items:center;gap:6px;font-weight:600;white-space:nowrap}
.con-nav button:hover{background:rgba(255,255,255,.07)}
.con-nav button.on{background:var(--blue);color:#fff;font-weight:800}
.con-side.lawyer .con-nav button.on{background:var(--green)}
.con-nav button i{font-style:normal;background:var(--red);color:#fff;border-radius:9px;font-size:12.5px;padding:0 6px}
.con-nav button.lock{opacity:.4}
.con-foot{margin-top:auto;font-size:12.5px;color:#6b7a9c;padding:8px}
.con-main{padding-block:20px 40px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));min-width:0;display:flex;flex-direction:column;gap:14px}
.con-main h2{margin:0;font-size:20px}
.a-grid{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:14px;align-items:start}
.lcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.denied{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:40px;text-align:center;color:var(--muted)}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:12.5px;background:var(--surface);cursor:pointer}
.checks label:has(input:checked){border-color:var(--green);background:var(--green-50);color:var(--green);font-weight:700}
.checks input{margin:0 0 0 4px}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-weight:700}
.switch input{width:18px;height:18px}

.overlay{position:fixed;inset:0;background:rgba(16,24,40,.5);display:grid;place-items:center;z-index:100;padding:16px}
.modal{background:var(--surface);border-radius:16px;max-width:520px;width:100%;max-height:90vh;overflow:auto;padding:22px}
.toast{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);left:max(16px,env(safe-area-inset-left,0px));background:var(--toast-bg);color:#fff;padding:10px 16px;border-radius:10px;z-index:200;font-size:13px;animation:drop .3s}
.invoice table{width:100%;border-collapse:collapse;font-size:13px}
.invoice td{padding:7px;border-bottom:1px solid var(--line)}
.invoice td:last-child{font-variant-numeric:tabular-nums}

@media (max-width:980px){
  .cols,.a-grid{grid-template-columns:minmax(0,1fr)}
  .hero{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .con{grid-template-columns:1fr}

/* الملف الشخصي: ثلاثة صفوف فقط (الاسم ، البريد ، كلمة المرور) */
function accountPage(name, who) {
  const row = (lbl, val, fn) => `<button class="arow" onclick="${fn}"><span><small>${lbl}</small><b>${val}</b></span>${ic('pencil', 18)}</button>`;
  return `<div class="narrow stack"><div class="slist">
    ${row('الاسم', esc(name), `editName('${who}')`)}${row('البريد الإلكتروني', 'يُضاف مع الدخول', 'editEmail()')}${row('كلمة المرور', '••••••••', 'editPass()')}</div></div>`;
}
function editName(who) {
  const cur = who === 'client' ? S.client.name : uname(who);
  modal(`<h3 style="margin-top:0">الاسم</h3><input type="text" id="nmIn" value="${esc(cur)}" placeholder="اسمك">
    <button class="btn block" style="margin-top:12px" onclick="saveName('${who}')">احفظ</button>`);
}
function saveName(who) {
  const v = (document.getElementById('nmIn').value || '').trim(); if (!v) return toastErr('اكتب اسمك');
  if (who === 'client') S.client.name = v; else user(who).name = v;
  closeModal(); render(); toast('انحفظ الاسم');
}
function editEmail() {
  modal(`<h3 style="margin-top:0">البريد الإلكتروني</h3><input type="email" id="emIn" inputmode="email" placeholder="البريد الجديد">
    <button class="btn block" style="margin-top:12px" onclick="closeModal();toast('في النسخة الكاملة يوصلك رمز على البريد الجديد')">أرسل لي الرمز</button>`);
}
function editPass() {
  modal(`<h3 style="margin-top:0">كلمة المرور</h3><div class="stack"><input type="password" id="pw1" placeholder="كلمة المرور الجديدة"><input type="password" id="pw2" placeholder="تأكيد كلمة المرور"></div>
    <button class="btn block" style="margin-top:12px" onclick="savePass()">احفظ</button>`);
}
function savePass() {
  const a = document.getElementById('pw1').value, b = document.getElementById('pw2').value;
  if (a.length < 8) return toastErr('كلمة المرور 8 أحرف أو أرقام على الأقل');
  if (a !== b) return toastErr('كلمتا المرور غير متطابقتين');
  closeModal(); toast('انحفظت (تجريبي)');
}

/* ================= بوابة العميل ================= */
const CV = { screen: 'home', orderId: null, reviseOpen: false };
const CNAV = [['home', 'طلباتي', 'house', "C.go('home')"], ['file', 'ملفي', 'folder-open', "C.go('file')"], ['complaints', 'الشكاوى', 'mailbox', "C.go('complaints')"], ['settings', 'الإعدادات', 'settings', "C.go('settings')"]];
function renderClient() {
  let body, back = "C.go('home')";
  switch (CV.screen) {
    case 'wizard': body = clientWizard(); break;
    case "order": body = clientOrder() + reportBtn(); break;
    case 'submitted': body = `<div class="narrow card" style="text-align:center;padding:36px 22px;margin-top:8px">
        <div class="big-ic ok">${ic('circle-check', 48)}</div><h2 style="margin:6px 0">وصلنا طلبك</h2>
        <p class="banner ok">«تم استلام طلبك، وجارٍ مراجعته من فريق خبير، وسيتم التواصل معك قريبًا.»</p>
        <p class="small muted">رقم الطلب : <b class="num">${esc(CV.orderId)}</b></p>
        <button class="btn lg" onclick="C.openOrder('${CV.orderId}')">تابع طلبك</button></div>`; break;
    case 'notifs': body = clientNotifs(); break;
    case 'account': body = accountPage(S.client.name, 'client'); back = "C.go('settings')"; break;
    case 'file': body = clientFile(); back = null; break;
    case 'complaints': body = clientComplaints(); back = null; break;
    case 'settings': body = settingsPage([['user-round', 'الملف الشخصي', "C.go('account')"], ...COMMON_SET]); back = null; break;
    default: body = clientHome(); back = null;
  }
  const unread = S.notifs.filter(n => !n.read).length;
  return shell({ tabs: CNAV, cur: CV.screen, body, back, bell: ["C.go('notifs')", unread] })
    + (pushQueue ? `<div class="push" onclick="C.openNotif('${pushQueue.id}')">${ic('bell', 18)} ${esc(pushQueue.text)}<small>خبير • الحين</small></div>` : '');
}
function clientHome() {
  const drafts = S.orders.filter(o => o.status === 'DRAFT');
  const list = S.orders.filter(o => o.status !== 'DRAFT').sort((a, b) => b.updatedAt - a.updatedAt);
  return `<section class="hero">
      <div><h1>اعرض مشكلتك مثل ما هي ، والباقي علينا</h1>
        <p>مرحباً ${esc(S.client.name)}. ما تحتاج تعرف نوع الخدمة ولا الجهة المختصة. فريق خبير يدرس طلبك ويحدد طريقه الصحيح ويتولى الحل.</p>
        <button class="btn light lg" onclick="C.newOrder()">{{i:plus}} طلب جديد</button></div>
      <ol class="how">
        <li><div><b>اعرض مشكلتك</b><span>أسئلة قصيرة حسب حالتك</span></div></li>
        <li><div><b>ندرسها ونحدد المسار</b><span>إجابة مجانية ، أو عرض واضح بالأتعاب والمدة</span></div></li>
        <li><div><b>ننجزها لك</b><span>تتابع كل خطوة وتستلم النتيجة هنا</span></div></li>
      </ol></section>
    ${drafts.map(d => {
      const left = Math.max(0, Math.ceil((d.createdAt + DRAFT_TTL - now()) / HOUR));
      return `<div class="banner warn row between" style="margin-top:14px"><span>{{i:file-pen}} عندك مسودة ما انرسلت ، تنحذف بعد <b class="num">${left} ساعة</b></span>
        <button class="btn sm" onclick="C.resume('${d.id}')">كمّل المسودة</button></div>`;
    }).join('')}
    <div class="sec-h"><h2>طلباتي</h2><span class="small muted">${list.length} طلب</span></div>
    ${list.length ? `<div class="ogrid">${list.map(o => {
      const s = stage(o);
      return `<button class="ocard" onclick="C.openOrder('${o.id}')">
        <div class="row between"><b class="num">${o.id}</b>${pill(o.status)}</div>
        <div style="font-weight:700">${esc(orderTitle(o))}</div>
        <div class="row between small muted"><span>${s.who === 'admin' || s.who === 'lawyer' || s.who === 'ceo' ? 'عند فريق خبير' : s.t || 'آخر تحديث ' + ago(o.updatedAt)}</span>${clientNeedsAction(o) ? '<span class="tag red">مطلوب منك إجراء</span>' : ''}</div>
      </button>`;
    }).join('')}</div>` : empty("inbox", "ما عندك طلبات بعد", `<button class="btn" onclick="C.newOrder()">طلب جديد</button>`)}`;
}
function clientWizard() {
  const o = order(CV.orderId);
  if (!o) { CV.screen = 'home'; return clientHome(); }
  const left = Math.max(0, Math.ceil((o.createdAt + DRAFT_TTL - now()) / HOUR));
  let body = '';
  if (o.step === 1) {
    body = `<div><h2 style="margin:0 0 4px">وش تحتاج ؟</h2><p class="small muted" style="margin:0">اختر الخدمة ، أو «عندي مشكلة» إذا ما أنت متأكد.</p></div>
      <div class="grid2">${SERVICES.map((s, i) => `<button class="choice ${i === 0 ? 'wide' : ''}" onclick="C.setService('${s.k}')"><span class="cic">${s.i}</span>${s.t}<small>${s.d}</small></button>`).join('')}</div>`;
  } else if (o.step === 2) {
    body = `<div><h2 style="margin:0 0 4px">وش تصنيف مشكلتك ؟</h2><p class="small muted" style="margin:0">الخدمة: ${svcLabel(o.service)}</p></div>
      <div class="grid2">${CATS.map(c => `<button class="choice" onclick="C.setCat('${c.k}')"><span class="cic">${c.i}</span>${c.t}</button>`).join('')}</div>
      <div class="card" style="border-style:dashed;border-color:var(--hover-line);background:var(--blue-50)">
        <h4>{{i:circle-help}} ما أعرف التصنيف ، بكتب مشكلتي</h4>
        <textarea id="freeText" placeholder="اشرح مشكلتك بكلامك مثل ما صارت">${esc(o.freeText)}</textarea>
        <button class="btn block" style="margin-top:8px" onclick="C.setFree()">متابعة</button></div>`;
  } else if (o.step === 3) {
    const q = nextQ(o);
    const answered = o.hist.map(k => `<div class="qa"><span class="q">${esc(qText(o, k))}</span><span class="a">${esc(o.answers[k] || 'لم يُحدد')}</span>
      <button class="btn ghost sm" onclick="C.editAns('${k}')">تعديل</button></div>`).join('');
    let qhtml;
    if (q) {
      const input = q.type === 'choice'
        ? `<div class="opts">${q.o.map((x, i) => `<button onclick="C.answer(${i})">${x}</button>`).join('')}</div>`
        : `<input id="qin" type="${q.type}" ${q.type === 'number' ? 'min="0" inputmode="numeric"' : ''} onkeydown="if(event.key==='Enter')C.answer()">
          <div class="row" style="margin-top:8px"><button class="btn grow" onclick="C.answer()">التالي</button>
          ${q.optional ? `<button class="btn ghost" onclick="C.answer(null,true)">لا أعرف</button>` : ''}</div>`;
      qhtml = `<div class="qbox"><div class="small muted">سؤال ${o.hist.length + 1}</div><div class="qt">${q.t}</div>${input}</div>`;
    } else {
      qhtml = `<div class="banner ok">{{i:check}} اكتملت البيانات اللي نحتاجها للدراسة.</div>
        <div><label class="f" for="notes">تفاصيل ثانية إن وجدت</label>
        <textarea id="notes" placeholder="تفاصيل ثانية إن وجدت">${esc(o.notes)}</textarea></div>
        <button class="btn block" onclick="C.toDocs()">التالي : المستندات</button>`;
    }
    body = `<div><h2 style="margin:0 0 4px">أسئلة قصيرة</h2><p class="small muted" style="margin:0">${catLabel(o.category)} — الأسئلة تطلع وحدة وحدة حسب إجاباتك.</p></div>
      ${o.freeText ? `<div class="req"><div class="meta">ما كتبته:</div>${esc(o.freeText)}</div>` : ''}
      ${answered ? `<div>${answered}</div>` : ''}${qhtml}`;
  } else if (o.step === 4) {
    body = `<div><h2 style="margin:0 0 4px">المستندات الأولية</h2><p class="small muted" style="margin:0">ارفع اللي عندك من عقود أو مراسلات أو صور ، إن وجدت.</p></div>
      <div class="card"><input type="file" id="wizFiles" multiple onchange="C.upload(this,'${o.id}')">
      <ul class="files" style="margin-top:8px">${o.docs.map((d, i) => `<li><span>{{i:paperclip}} ${esc(d.name)} <span class="muted small">(${Math.ceil(d.size / 1024)} KB)</span></span>
        <button class="btn ghost sm" onclick="C.rmDoc(${i})">حذف</button></li>`).join('') || '<li class="muted">ما رفعت ملفات</li>'}</ul></div>
      <div class="row"><button class="btn ghost" onclick="C.step(3)">رجوع</button><button class="btn grow" onclick="C.step(5)">التالي : المراجعة</button></div>`;
  } else {
    const s = summary(o), nf = '<span class="muted">لم يُذكر</span>';
    body = `<div><h2 style="margin:0 0 4px">راجع طلبك قبل ما ترسله</h2></div>
      <div class="banner info small">هذي بياناتك مثل ما كتبتها.</div>
      <div class="card"><dl class="kv">
        <dt>الخدمة</dt><dd>${svcLabel(o.service)}</dd><dt>التصنيف</dt><dd>${catLabel(o.category)}</dd>
        <dt>الطرف الآخر</dt><dd>${esc(s.otherParty) || nf}</dd><dt>الموضوع</dt><dd>${esc(s.subject) || nf}</dd>
        <dt>المبلغ</dt><dd class="num">${s.amount || nf}</dd><dt>التاريخ</dt><dd class="num">${esc(s.date) || nf}</dd>
        <dt>المستندات</dt><dd>${o.docs.length} ملف</dd></dl></div>
      ${o.notes ? `<div class="card small"><b>تفاصيل إضافية:</b> ${esc(o.notes)}</div>` : ''}
      <div class="row"><button class="btn ghost" onclick="C.step(3)">عدّل الإجابات</button><button class="btn green grow lg" onclick="C.submit()">أرسل الطلب</button></div>`;
  }
  return `<div class="narrow stack">
    <div class="banner warn draft-bar">{{i:triangle-alert}} هذا الطلب <b>مسودة</b> وينحذف بعد <b class="num">${left} ساعة</b> إذا ما أرسلته.</div>
    <div class="small muted num" style="text-align:center"><span>${o.id} • الخطوة ${o.step} من 5</span></div>
    <div class="steps">${[1, 2, 3, 4, 5].map(i => `<div class="${i <= o.step ? 'on' : ''}"></div>`).join('')}</div>
    ${body}
    <div style="text-align:center"><button class="btn danger-ghost sm" onclick="C.delDraft()">احذف المسودة</button></div></div>`;
}
function clientOrder() {
  const o = order(CV.orderId);
  if (!o) { CV.screen = 'home'; return clientHome(); }
  const s = stage(o), sm = summary(o);
  const tl = [['المراجعة', true], ['العقد', !!(o.contract && o.contract.acceptedAt) || !!o.freeAnswer], ['الدفع', !!o.payment || !!o.freeAnswer],
    ['التنفيذ', ['READY_DELIVERY', 'CLOSED'].includes(o.status)], ['التسليم', o.status === 'CLOSED']];
  const curIdx = tl.findIndex(x => !x[1]);
  const timeline = o.status === 'CANCELLED' ? '' : `<div class="card" style="padding:14px 8px"><div class="timeline">${tl.map((x, i) =>
    `<div class="${x[1] ? 'done' : i === curIdx ? 'cur' : ''}"><b>${x[1] ? '{{i:check}}' : i + 1}</b>${x[0]}</div>`).join('')}</div></div>`;
  let action = '';
  if (o.freeAnswer) {
    action = `<div class="card" style="border-color:var(--ok-line);background:var(--green-50)"><h3>{{i:lightbulb}} الإجابة النهائية من خبير (مجانية)</h3><p style="margin:0">${esc(o.freeAnswer.text)}</p>
      <div class="small muted" style="margin-top:6px">${fdt(o.freeAnswer.at)}</div></div>`;
  } else if (o.contract && !o.contract.acceptedAt && o.status === 'UNDER_REVIEW') {
    action = contractCard(o, true);
  } else if (o.contract && o.contract.acceptedAt && !o.payment && o.status === 'UNDER_REVIEW') {
    const total = o.contract.fee * (1 + VAT);
    action = `<div class="card"><h3>{{i:credit-card}} سداد الأتعاب</h3>
      <div class="row between"><span class="muted">الإجمالي شامل الضريبة</span><b class="num" style="font-size:19px">${money(total)}</b></div>
      <div class="pay-opts">${['مدى', 'Visa', 'Mastercard'].map((m, i) => `<label><input type="radio" name="pm" value="${m}" ${i === 0 ? 'checked' : ''}>${m}</label>`).join('')}</div>
      <div class="small muted" style="margin-bottom:10px">{{i:lock}} دفع تجريبي : ما نطلب بيانات بطاقة في هذي النسخة.</div>
      <button class="btn green block" onclick="C.pay()">ادفع ${money(total)}</button></div>`;
  } else if (o.payment && !o.ceoApproved && o.status === 'UNDER_REVIEW') {
    action = `<div class="banner info">{{i:circle-check}} انسدد المبلغ. ننتظر إدارة خبير تعتمد بدء التنفيذ ، ويوصلك إشعار أول ما نبدأ.</div>`;
  } else if (o.status === 'READY_DELIVERY') {
    const third = o.revisions.length === 2;
    action = resultCard(o) + `<div class="card"><h3>النتيجة مناسبة ؟</h3>
      <div class="stack"><button class="btn green block" onclick="C.acceptResult()">{{i:check}} استلمت ، أغلق الطلب</button>
      <button class="btn ghost block" onclick="C.toggleRevise()">أبي تعديل</button></div>
      ${CV.reviseOpen ? `<div class="stack" style="margin-top:12px">
        <div class="banner info small">التعديل خدمة تابعة للعمل الأصلي ومجانية ما دامت ضمن النطاق المتفق عليه.</div>
        ${third ? `<div class="banner warn small">{{i:bell}} تنبيه: هذه <b>المرة الثالثة</b> لطلب المراجعة على هذا الطلب.</div>` : ''}
        <textarea id="reviseText" placeholder="وش التعديل اللي تبيه بالضبط ؟"></textarea>
        <button class="btn block" onclick="C.revise()">أرسل طلب التعديل</button></div>` : ''}</div>`;
  } else if (o.status === 'CLOSED' && o.result) action = resultCard(o);
  else if (o.status === 'IN_PROGRESS') action = `<div class="banner info">{{i:settings}} نشتغل على طلبك${o.revisions.length ? ` (تعديل رقم ${o.revisions.length})` : ''}. المدة المتفق عليها: ${o.contract ? o.contract.days + ' يوم' : '—'}.</div>`;
  else if (o.status === 'UNDER_REVIEW') action = `<div class="banner info">«تم استلام طلبك، وجارٍ مراجعته من فريق خبير، وسيتم التواصل معك قريبًا.»</div>`;
  else if (o.status === 'CANCELLED') action = `<div class="banner err">انلغى هذا الطلب.</div>`;
  if (o.contract && o.contract.acceptedAt) action += `<details class="card"><summary><b>{{i:scroll-text}} العقد المعتمد</b></summary><div style="margin-top:10px">${contractCard(o, false)}</div></details>`;
  if (o.payment) action += `<button class="btn ghost block" onclick="showInvoice('${o.id}')">{{i:receipt}} الفاتورة ${o.payment.invoice}</button>`;

  const active = !['CLOSED', 'CANCELLED'].includes(o.status);
  const types = [['inquiry', 'استفسار عن الطلب']];
  if (o.status === 'IN_PROGRESS' && !o.uploadUnlocked) types.push(['upload', 'طلب إضافة مستند']);
  if (o.contract) types.push(['change', 'طلب تعديل أو إلغاء']);
  const reqs = `<div class="card"><h3>{{i:pin}} التنبيهات والطلبات</h3>
    <p class="small muted" style="margin-top:-4px">تتواصل مع خبير من هنا ، بطلبات مرتبطة بهذا الطلب.</p>
    <div class="stack">${o.requests.map(r => reqView(r, 'client')).join('') || '<div class="small muted">ما فيه تنبيهات</div>'}</div>
    ${active ? `<details style="margin-top:10px"><summary class="small" style="color:var(--blue);font-weight:700;cursor:pointer">+ أرسل تنبيه على الطلب</summary>
      <div class="stack" style="margin-top:8px"><select id="rqType">${types.map(t => `<option value="${t[0]}">${t[1]}</option>`).join('')}</select>
      <textarea id="rqText" placeholder="اكتب طلبك"></textarea><button class="btn block" onclick="C.request()">أرسل</button></div></details>` : ''}
    ${o.status === 'UNDER_REVIEW' && !o.contract && !o.freeAnswer ? `<button class="btn danger-ghost block sm" style="margin-top:12px" onclick="C.cancel()">ألغِ الطلب</button>` : ''}
    ${o.contract && active ? `<div class="small muted" style="margin-top:10px">بعد ما يطلع العقد ما تقدر تلغي أو تعدّل مباشرة. أرسل «طلب تعديل أو إلغاء» وإدارة خبير تدرسه.</div>` : ''}</div>`;
  const docs = `<div class="card"><h3>{{i:paperclip}} المستندات</h3>
    <ul class="files">${o.docs.map(d => `<li><span>${d.by === 'client' ? '{{i:file-text}}' : '{{i:building-2}}'} ${esc(d.name)}</span><span class="small muted">${fdt(d.at)}</span></li>`).join('') || '<li class="muted">ما فيه مستندات</li>'}</ul>
    ${active && canClientUpload(o) ? `<div style="margin-top:10px">${o.uploadUnlocked ? '<div class="banner ok small" style="margin-bottom:8px">انفتح لك رفع مستند.</div>' : ''}<input type="file" id="ordFiles" multiple onchange="C.upload(this,'${o.id}')"></div>`
      : active ? `<div class="small muted" style="margin-top:10px">{{i:lock}} الرفع مقفل بعد بدء التنفيذ. تبي تضيف مستند ؟ أرسل تنبيه من نوع «طلب إضافة مستند».</div>` : ''}</div>`;
  const data = `<details class="card"><summary><b>بيانات طلبك مثل ما أرسلتها</b></summary>
    <dl class="kv" style="margin-top:10px"><dt>الخدمة</dt><dd>${svcLabel(o.service)}</dd><dt>التصنيف</dt><dd>${catLabel(o.category)}</dd>
    <dt>الطرف الآخر</dt><dd>${esc(sm.otherParty) || '—'}</dd><dt>الموضوع</dt><dd>${esc(sm.subject) || '—'}</dd>
    <dt>المبلغ</dt><dd class="num">${sm.amount || '—'}</dd><dt>التاريخ</dt><dd class="num">${esc(sm.date) || '—'}</dd></dl>
    ${o.freeText ? `<p class="small">${esc(o.freeText)}</p>` : ''}${o.notes ? `<p class="small">${esc(o.notes)}</p>` : ''}</details>`;
  const clientStage = ['admin', 'lawyer', 'ceo'].includes(s.who) && o.status === 'UNDER_REVIEW' && !o.payment ? 'عند فريق خبير للدراسة' : s.t;
  return `<div class="stack">
    <div class="small muted" style="text-align:center">أُرسل ${fdt(o.submittedAt)}</div>
    <div class="row between"><h2 style="margin:0;font-size:20px"><span class="num">${o.id}</span> — ${esc(orderTitle(o))}</h2>${pill(o.status)}</div>
    ${clientStage ? `<div class="small muted" style="margin-top:-6px">${clientStage}</div>` : ''}
    <div class="cols"><div class="stack">${timeline}${action}${data}</div><div class="stack">${reqs}${docs}</div></div></div>`;
}
function contractCard(o, actionable) {
  const c = o.contract, vat = c.fee * VAT;
  return `<div class="contract">
    <div class="hd"><b>{{i:scroll-text}} العقد الإلكتروني الموحد</b><span class="small muted num">${o.id}</span></div>
    <dl class="kv"><dt>الطرفان</dt><dd>${esc(S.client.name)} و خبير</dd>

const C = {
  go(s) { CV.screen = s; CV.reviseOpen = false; render(); scrollTo(0, 0); },
  openOrder(id) { const o = order(id); if (!o) return; if (o.status === 'DRAFT') return C.resume(id); CV.screen = 'order'; CV.orderId = id; CV.reviseOpen = false; render(); scrollTo(0, 0); },
  openNotif(id) { const n = S.notifs.find(x => x.id === id); if (n) n.read = true; pushQueue = null; n && n.orderId && order(n.orderId) ? C.openOrder(n.orderId) : render(); },
  newOrder() {
    const t = now();
    const o = { id: 'KH-' + (++S.seq), clientId: 'c1', status: 'DRAFT', service: null, category: null, freeText: '', notes: '', answers: {}, hist: [], step: 1, docs: [], requests: [], internal: [], revisions: [],
      contract: null, payment: null, ceoApproved: false, result: null, freeAnswer: null, payout: null, assignee: null, assignAccepted: false, triaged: false, uploadUnlocked: false,
      createdAt: t, submittedAt: null, lastActionAt: t, updatedAt: t };
    S.orders.push(o); CV.orderId = o.id; CV.screen = 'wizard'; render(); scrollTo(0, 0);
  },
  resume(id) { CV.orderId = id; CV.screen = 'wizard'; render(); scrollTo(0, 0); },
  cur() { return order(CV.orderId); },
  step(n) { const o = C.cur(); o.step = n; o.updatedAt = now(); render(); },
  setService(k) { const o = C.cur(); o.service = k; o.step = 2; render(); },
  setCat(k) { const o = C.cur(); if (o.category !== k) { o.answers = {}; o.hist = []; } o.category = k; o.freeText = ''; o.step = 3; render(); },
  setFree() {
    const v = document.getElementById('freeText').value.trim();
    if (v.length < 10) return toastErr('اكتب وصفاً للمشكلة من 10 أحرف على الأقل');
    const o = C.cur(); if (o.category !== 'free') { o.answers = {}; o.hist = []; } o.category = 'free'; o.freeText = v; o.step = 3; render();
  },
  answer(i, skip) {
    const o = C.cur(), q = nextQ(o); if (!q) return;
    let v;
    if (skip) v = '';
    else if (q.type === 'choice') v = q.o[i];
    else { v = (document.getElementById('qin').value || '').trim(); if (!v) return toastErr('أجب عن السؤال أو اختر «لا أعرف»'); }
    o.answers[q.k] = v; o.hist.push(q.k); o.updatedAt = now(); render();
    setTimeout(() => { const el = document.getElementById('qin'); el && el.focus(); }, 0);
  },
  editAns(k) { const o = C.cur(); const i = o.hist.indexOf(k); o.hist.slice(i).forEach(x => delete o.answers[x]); o.hist = o.hist.slice(0, i); render(); },
  toDocs() { const o = C.cur(); o.notes = document.getElementById('notes').value.trim(); o.step = 4; render(); },
  upload(inp, id) {
    const o = order(id), n = inp.files.length;
    [...inp.files].forEach(f => o.docs.push({ name: f.name, size: f.size, at: now(), by: 'client' }));
    if (o.status !== 'DRAFT') {
      audit('رفع مستند', o.id, [...inp.files].map(f => f.name).join('، '), 'العميل');
      o.uploadUnlocked = false; touch(o); notifyTeam(o, `رفع العميل مستنداً جديداً في الطلب ${o.id}`);
    }
    render(); toast(`تم رفع ${n} ملف`);
  },
  rmDoc(i) { C.cur().docs.splice(i, 1); render(); },
  submit() {
    const o = C.cur(); o.status = 'UNDER_REVIEW'; o.submittedAt = now(); touch(o);
    audit('إنشاء طلب', o.id, `إرسال الطلب — ${catLabel(o.category)}`, 'العميل');
    push('تم استلام طلبك، وجارٍ مراجعته من فريق خبير، وسيتم التواصل معك قريبًا.', o.id);
    notifyRole('reception', `طلب جديد ${o.id} بانتظار الفرز والإسناد`, o.id);
    CV.screen = 'submitted'; render(); scrollTo(0, 0);
  },
  delDraft() {
    const i = S.orders.findIndex(o => o.id === CV.orderId), gone = S.orders[i];
    S.orders.splice(i, 1); CV.screen = "home"; render();
    toast("انحذفت المسودة", () => { S.orders.splice(i, 0, gone); CV.orderId = gone.id; CV.screen = "wizard"; render(); });
  },
  acceptContract() {
    const o = C.cur(); o.contract.acceptedAt = now(); o.updatedAt = now();
    audit('اعتماد عقد', o.id, `موافقة على السعر والنطاق والمدة — ${money(o.contract.fee)} / ${o.contract.days} يوم`, 'العميل');
    notifyStaff(o.assignee, `اعتمد العميل عقد الطلب ${o.id}`, o.id);
    render(); toast('اعتمدت العقد ، تقدر تسدد الحين');
  },
  pay() {
    const o = C.cur(), m = (document.querySelector('input[name=pm]:checked') || {}).value || 'مدى';
    const inv = 'INV-' + new Date(now()).getFullYear() + '-' + String(++S.invoices).padStart(4, '0');
    o.payment = { method: m, amount: o.contract.fee * (1 + VAT), at: now(), invoice: inv }; touch(o);
    audit('دفع', o.id, `${m} — ${money(o.payment.amount)} — ${inv}`, 'العميل');
    push(`تم سداد أتعاب الطلب ${o.id} وإصدار الفاتورة ${inv}`, o.id);
    notifyRole('ceo', `الطلب ${o.id} مسدد وبانتظار اعتمادك لبدء التنفيذ`, o.id);
    notifyStaff(o.assignee, `سدد العميل أتعاب الطلب ${o.id} — بانتظار اعتماد المدير`, o.id);
    render(); showInvoice(o.id);
  },
  acceptResult() {
    const o = C.cur(); o.status = 'CLOSED'; touch(o);
    audit('إغلاق الطلب', o.id, 'استلام نهائي من العميل', 'العميل');
    notifyStaff(o.assignee, `أغلق العميل الطلب ${o.id} — أتعابك أصبحت مستحقة`, o.id);
    render(); toast('انغلق الطلب ، شكراً لثقتك');
  },
  toggleRevise() { CV.reviseOpen = !CV.reviseOpen; render(); },
  revise() {
    const o = C.cur(), v = document.getElementById('reviseText').value.trim();
    if (!v) return toastErr('وضّح التعديل المطلوب');
    o.revisions.push({ text: v, at: now() });
    o.requests.push({ id: nid('r'), from: 'client', type: 'revision', text: v, at: now(), status: 'open' });
    o.status = 'IN_PROGRESS'; touch(o); CV.reviseOpen = false;
    audit('طلب تعديل', o.id, `المراجعة رقم ${o.revisions.length}: ${v}`, 'العميل');
    notifyStaff(o.assignee, `طلب العميل تعديلاً على الطلب ${o.id} (رقم ${o.revisions.length})`, o.id);
    if (o.revisions.length === 3) push(`تنبيه: هذه المرة الثالثة لطلب المراجعة على الطلب ${o.id}`, o.id);
    render(); toast('تم أرسل طلب التعديل');
  },
  request() {
    const o = C.cur(), type = document.getElementById('rqType').value, text = document.getElementById('rqText').value.trim();
    if (!text) return toastErr('اكتب الطلب أولاً');
    o.requests.push({ id: nid('r'), from: 'client', type, text, at: now(), status: 'open' }); touch(o);
    audit('تنبيه من العميل', o.id, `${REQ_T[type]}: ${text}`, 'العميل');
    notifyTeam(o, `${REQ_T[type]} من العميل في الطلب ${o.id}`);
    if (type === 'change') notifyRole('ceo', `طلب تعديل/إلغاء على الطلب ${o.id} بانتظار قرارك`, o.id);
    render(); toast('انرسل التنبيه');
  },
  replyTeam(rid) {
    const o = C.cur(), r = o.requests.find(x => x.id === rid), v = document.getElementById('rep_' + rid).value.trim();
    if (!v) return; r.reply = v; r.status = 'done'; touch(o);
    audit('تعديل بيانات', o.id, `استكمال من العميل: ${v}`, 'العميل'); notifyTeam(o, `استكمل العميل البيانات في الطلب ${o.id}`); render();
  },
  cancel(ok) {
    if (!ok) return ask(`تلغي الطلب «${C.cur().id}» ؟`, "ما يرجع أبداً بعد الإلغاء.", "ألغِ الطلب", () => C.cancel(true));
    const o = C.cur(); o.status = 'CANCELLED'; touch(o); audit('إلغاء طلب', o.id, 'إلغاء من العميل قبل صدور العقد', 'العميل');
    notifyTeam(o, `ألغى العميل الطلب ${o.id}`); render();
  },
  complain() {
    const text = document.getElementById('cpText').value.trim(); if (!text) return toastErr('اكتب الشكوى أو الاقتراح');
    const c = { id: nid('cp'), type: document.getElementById('cpType').value, orderId: document.getElementById('cpOrder').value, text, at: now(), status: 'open' };
    const lbl = c.type === 'complaint' ? 'شكوى' : 'اقتراح';
    S.complaints.push(c); notifyRole('reception', `${lbl} جديد من العميل`, c.orderId); notifyRole('ceo', `${lbl} جديد من العميل`, c.orderId);
    render(); toast('انرسل');
  },
};

  return `<div><h2>أهلاً ${esc(u.name)}</h2><div class="small muted">${ROLES[u.role]} • ${(u.specialties || []).map(catLabel).join('، ') || '—'} ${u.active === false ? '• <span class="tag red">غير متاح لإسنادات جديدة</span>' : ''}</div></div>

      <button class="btn sm" style="margin-top:6px" onclick="K.askClient()">إرسال تنبيه للعميل</button></div>`;
  }
  if (open && canWork && o.assignee) {
    act += `<div class="card"><h4>نتيجة الدراسة الأولية ${!lw ? '<span class="tag">بصفتك مختصاً</span>' : ''}</h4>
      <details><summary class="small" style="font-weight:700;cursor:pointer;color:var(--green)">أ. إجابة نهائية مجانية (وإغلاق الطلب)</summary>
        <textarea id="faText" style="margin-top:6px" placeholder="الإجابة مع توجيه العميل للمسار الصحيح..."></textarea>
        <button class="btn green sm" style="margin-top:6px" onclick="K.freeAnswer()">إرسال الإجابة وإغلاق الطلب</button></details>
      <details style="margin-top:10px" open><summary class="small" style="font-weight:700;cursor:pointer;color:var(--blue)">ب. خدمة مدفوعة — إصدار عقد إلكتروني</summary>
        <label class="f" for="ctScope">نطاق العمل</label><textarea id="ctScope" placeholder="وصف دقيق لما سيقدمه خبير..."></textarea>
        <div class="row"><div class="grow"><label class="f" for="ctFee">الأتعاب قبل الضريبة (ر.س)</label><input id="ctFee" type="number" min="0" oninput="K.feePreview()"></div>
        <div class="grow"><label class="f" for="ctDays">المدة (يوم)</label><input id="ctDays" type="number" min="1"></div></div>
        <div class="small muted num" id="feePrev" style="margin-top:6px"></div>
        <button class="btn dark sm" style="margin-top:8px" onclick="K.issueContract()">إصدار العقد للعميل</button></details></div>`;
  }
  if (ua && o.contract && !o.contract.acceptedAt) act += `<div class="banner warn small">{{i:scroll-text}} العقد صادر — بانتظار اعتماد العميل.</div>`;
  if (ua && o.contract && o.contract.acceptedAt && !o.payment) act += `<div class="banner warn small">{{i:credit-card}} العقد معتمد — بانتظار سداد العميل.</div>`;
  if (ua && o.payment && !o.ceoApproved) {
    act += !lw && can('approve')
      ? `<div class="card" style="border:2px solid var(--navy)"><h4>{{i:shield}} بوابة المدير التنفيذي (CEO Gate)</h4>
          <p class="small muted" style="margin-top:0">العقد معتمد والأتعاب مسددة (${money(o.payment.amount)} — ${o.payment.invoice}). لا يبدأ العمل إلا باعتمادك.</p>
          <button class="btn dark block" onclick="K.approve()">اعتماد بدء التنفيذ ← قيد التنفيذ</button></div>`
      : `<div class="banner info small">{{i:shield}} تم السداد — بانتظار الاعتماد الحصري من المدير التنفيذي لبدء التنفيذ.</div>`;
  }
  if (o.status === 'IN_PROGRESS') {
    act += canWork ? `<div class="card"><h4>{{i:package}} تسليم النتيجة للعميل</h4>
      ${o.revisions.length ? `<div class="banner ${o.revisions.length >= 3 ? 'warn' : 'info'} small" style="margin-bottom:8px">طلب تعديل رقم ${o.revisions.length}${o.revisions.length >= 3 ? ' (المرة الثالثة أو أكثر)' : ''}: «${esc(o.revisions[o.revisions.length - 1].text)}»</div>` : ''}
      <label class="f" for="resFiles">ملفات المخرجات</label><input type="file" id="resFiles" multiple>
      <label class="f" for="resNote">ملاحظة للعميل</label><textarea id="resNote" placeholder="ملخص ما تم إنجازه والخطوات التالية..."></textarea>
      <button class="btn green block" style="margin-top:8px" onclick="K.deliver()">رفع النتيجة ← جاهز للتحميل</button></div>`
      : `<div class="banner info small">{{i:settings}} ${s.t}.</div>`;
  }
  if (o.status === 'READY_DELIVERY') act += `<div class="banner ok small">{{i:package}} النتيجة مرفوعة — بانتظار استلام العميل أو طلب تعديل.</div>`;
  if (!lw && can('reassign') && o.assignee && !open && !['CLOSED', 'CANCELLED'].includes(o.status)) {
    act += `<div class="card"><h4>إعادة الإسناد</h4><div class="small">الحالي: <b>${esc(uname(o.assignee))}</b></div>
      <div class="row" style="margin-top:6px"><select id="assignSel" class="grow" aria-label="المحامي">${recommend(o).map(r => `<option value="${r.u.id}" ${r.u.id === o.assignee ? 'selected' : ''}>${esc(r.u.name)}</option>`).join('')}</select>
      <button class="btn sm" onclick="K.assign()">نقل</button></div></div>`;
  }
  const e = earning(o);
  if (lw && o.contract) act += `<div class="card small"><h4>{{i:briefcase}} أتعابك من هذا الطلب</h4><dl class="kv"><dt>الأتعاب</dt><dd class="num">${money(o.contract.fee)}</dd><dt>عمولة المنصة</dt><dd class="num">${money(o.contract.fee * commission())}</dd><dt>الصافي</dt><dd class="num">${money(o.contract.fee * (1 - commission()))}</dd>${e ? `<dt>الحالة</dt><dd>${earnTag(e.status)}</dd>` : ''}</dl></div>`;

  const reqs = o.requests.map(r => {
    let ctl = '';
    if (r.from === 'client' && r.status === 'open' && (lw ? mineAccepted : true)) {
      ctl = `<textarea id="ar_${r.id}" style="margin-top:6px;min-height:50px" placeholder="الرد على العميل..."></textarea><div class="row" style="margin-top:4px">
        <button class="btn sm" onclick="K.reply('${r.id}')">رد وإغلاق</button>
        ${r.type === 'upload' && can('unlock') ? `<button class="btn green sm" onclick="K.unlock('${r.id}')">فتح صلاحية الرفع</button>` : ''}
        ${r.type === 'change' ? (can('decide') ? `<button class="btn red sm" onclick="K.cancelByAdmin('${r.id}')">اعتماد الإلغاء</button>` : '<span class="small muted">قرار التعديل/الإلغاء لإدارة خبير</span>') : ''}</div>`;
    }
    return reqView(r, 'staff', ctl);
  }).join('');
  const tlog = !lw && can('audit') ? S.audit.filter(a => a.orderId === o.id).slice().reverse() : [];
  return `<div class="row between"><div class="row"><button class="btn ghost sm" onclick="K.go('orders')">→ الطلبات</button><h2 class="num">${o.id}</h2>${pill(o.status)}
      ${isLate(o) ? '<span class="tag red">{{i:clock}} متأخر</span>' : ''}</div><span class="small muted">${s.t}</span></div>
    <div class="a-grid"><div class="stack">
      <div class="card"><h3>بيانات الطلب (كما أدخلها العميل)</h3>
        <dl class="kv"><dt>العميل</dt><dd>${esc(S.client.name)} — ملف ${S.client.fileNo}</dd><dt>الخدمة</dt><dd>${svcLabel(o.service)}</dd><dt>التصنيف</dt><dd>${catLabel(o.category)}</dd>
        <dt>الطرف الآخر</dt><dd>${esc(sm.otherParty) || '—'}</dd><dt>الموضوع</dt><dd>${esc(sm.subject) || '—'}</dd><dt>المبلغ</dt><dd class="num">${sm.amount || '—'}</dd>
        <dt>التاريخ</dt><dd class="num">${esc(sm.date) || '—'}</dd><dt>أُرسل</dt><dd>${fdt(o.submittedAt)}</dd>${!lw ? `<dt>المحامي</dt><dd>${esc(uname(o.assignee))}</dd>` : ''}</dl>
        ${o.freeText ? `<div class="req" style="margin-top:10px"><div class="meta">وصف العميل الحر</div>${esc(o.freeText)}</div>` : ''}
        ${o.notes ? `<div class="req" style="margin-top:8px"><div class="meta">تفاصيل إضافية</div>${esc(o.notes)}</div>` : ''}
        <details style="margin-top:8px"><summary class="small" style="cursor:pointer">جميع الأسئلة والإجابات (${Object.keys(o.answers).length})</summary>
          ${Object.entries(o.answers).map(([k, v]) => `<div class="qa"><span class="q">${esc(qText(o, k))}</span><span class="a">${esc(v || 'لم يُحدد')}</span></div>`).join('')}</details></div>
      ${o.freeAnswer ? `<div class="card" style="border-color:var(--ok-line)"><h4>{{i:lightbulb}} الإجابة المجانية المرسلة</h4>${esc(o.freeAnswer.text)}<div class="small muted">${esc(uname(o.freeAnswer.by))} • ${fdt(o.freeAnswer.at)}</div></div>` : ''}
      ${o.contract ? contractCard(o, false) + `<div class="small muted">أصدره ${esc(uname(o.contract.issuedBy))} • الدفع: ${o.payment ? `{{i:check}} ${o.payment.method} • <a href="#${PORTAL}" onclick="showInvoice('${o.id}');return false">${o.payment.invoice}</a>` : 'لم يُسدد'} • اعتماد التنفيذ: ${o.ceoApproved ? '{{i:check}}' : 'بانتظار'}</div>` : ''}
      ${o.result ? resultCard(o) : ''}
      <div class="card"><h3>{{i:pin}} التنبيهات الهيكلية</h3><div class="stack">${reqs || '<div class="small muted">لا توجد</div>'}</div></div>
      <div class="card"><h3>{{i:paperclip}} المستندات</h3><ul class="files">${o.docs.map(d => `<li><span>${d.by === 'client' ? '{{i:file-text}}' : '{{i:building-2}}'} ${esc(d.name)}</span><span class="small muted">${d.by === 'client' ? 'العميل' : 'خبير'} • ${fdt(d.at)}</span></li>`).join('') || '<li class="muted">—</li>'}</ul>
        <div class="small muted" style="margin-top:8px">رفع العميل المباشر: ${canClientUpload(o) ? '<span class="tag green">مفتوح</span>' : '<span class="tag">مغلق</span>'}</div></div>
      <div class="card"><h3>{{i:notebook-pen}} ملاحظات داخلية (لا تظهر للعميل)</h3><div class="stack">
        ${o.internal.map(n => `<div class="req"><div>${esc(n.text)}</div><div class="meta">${esc(n.by)} • ${fdt(n.at)}</div></div>`).join('')}
        <div class="row"><input type="text" id="noteIn" class="grow" aria-label="ملاحظة داخلية" placeholder="أضف ملاحظة..." onkeydown="if(event.key==='Enter')K.note()"><button class="btn sm" onclick="K.note()">إضافة</button></div></div></div>
    </div><div class="stack">
      <div class="ai"><h4>{{i:bot}} المساعد الخلفي (AI) — داخلي فقط</h4>
        <div class="small" style="color:var(--violet);margin-bottom:8px">مساند للفرز والاستخراج والمراجعة. لا يُعرض للعميل ولا يُنسب إليه.</div>
        <dl class="kv small"><dt>تصنيف مقترح</dt><dd>${ai.suggested ? catLabel(ai.suggested) : 'غير كافٍ'} ${ai.mismatch ? '<span class="tag amber">يختلف عن اختيار العميل</span>' : ''}</dd>
        <dt>المسار المحتمل</dt><dd>${ai.route}</dd><dt>مبالغ مستخرجة</dt><dd class="num">${ai.amounts.length ? ai.amounts.map(money).join('، ') : '—'}</dd>
        <dt>نواقص</dt><dd>${ai.missing.length ? ai.missing.join('، ') : 'لا يوجد'}</dd></dl>
        ${ai.flags.map(f => `<div class="small" style="margin-top:4px">${f}</div>`).join('')}</div>
      ${act}
      ${tlog.length ? `<div class="card"><h4>{{i:shield}} سجل إجراءات الطلب</h4>${tlog.map(a => `<div class="qa small"><span class="q">${fdt(a.at)}<br>${esc(a.user)}</span><span class="a">${esc(a.action)}</span></div>`).join('')}</div>` : ''}
    </div></div>`;
}

const K = {
  login(id) { if (PORTAL === 'lawyer') { S.curLawyer = id; LV.view = 'home'; } else S.curAdmin = id; render(); toast(`تم الدخول باسم ${me().name}`); },
  go(v) { V().view = v; render(); scrollTo(0, 0); },
  open(id) { const v = V(); v.view = 'order'; v.orderId = id; render(); scrollTo(0, 0); },
  filter(f) { V().filter = f; render(); },
  openNotif(id) {
    const n = S.snotifs.find(x => x.id === id); if (n) n.read = true;
    const o = n && n.orderId && order(n.orderId);
    o && (PORTAL === 'admin' || o.assignee === me().id) ? K.open(o.id) : render();
  },
  cur() { return order(V().orderId); },
  val(id) { const el = document.getElementById(id); return el ? el.value.trim() : ''; },
  assign() {
    const o = K.cur(), to = K.val('assignSel'); if (!to || to === o.assignee) return toastErr('اختر محامياً مختلفاً');
    const from = o.assignee;
    o.assignee = to; o.triaged = true; o.assignAccepted = !!o.contract; touch(o);
    audit(from ? 'نقل طلب' : 'فرز وإسناد', o.id, from ? `من ${uname(from)} إلى ${uname(to)}` : `إلى ${uname(to)}`);
    notifyStaff(to, o.contract ? `نُقل إليك الطلب ${o.id}` : `أُسند إليك الطلب ${o.id} — بانتظار قبولك`, o.id);
    if (from) notifyStaff(from, `نُقل الطلب ${o.id} إلى محامٍ آخر`, o.id);
    render(); toast('انسند الطلب ووصل المحامي إشعار');
  },
  accept() { const o = K.cur(); o.assignAccepted = true; touch(o); audit('قبول الإسناد', o.id, ''); render(); toast('قبلت الإسناد ، ابدأ الدراسة'); },
  decline() {
    const o = K.cur(), why = K.val('declineWhy'); if (!why) return toastErr('اذكر سبب الاعتذار');
    audit('اعتذار عن الإسناد', o.id, why); o.assignee = null; o.assignAccepted = false; touch(o);
    notifyRole('reception', `اعتذر ${me().name} عن الطلب ${o.id}: ${why}`, o.id); notifyRole('ceo', `اعتذار عن الطلب ${o.id} — يحتاج إعادة إسناد`, o.id);
    LV.view = 'home'; render(); toast('انرسل اعتذارك للإدارة');
  },
  askClient() {
    const o = K.cur(), v = K.val('needText'); if (!v) return toastErr('اكتب المطلوب من العميل');
    o.requests.push({ id: nid('r'), from: 'team', type: 'complete', text: v, at: now(), status: 'open' }); o.uploadUnlocked = true; touch(o);
    audit('طلب استكمال', o.id, v); push(`مطلوب استكمال بيانات لطلبك ${o.id}`, o.id); render(); toast('انرسل التنبيه للعميل');
  },
  freeAnswer() {
    const o = K.cur(), v = K.val('faText'); if (!v) return toastErr('اكتب الإجابة أولاً');
    o.freeAnswer = { text: v, at: now(), by: me().id }; o.status = 'CLOSED'; o.assignee = o.assignee || me().id; touch(o);
    audit('إرسال نتيجة', o.id, 'إجابة نهائية مجانية وإغلاق الطلب'); push(`وصلتك إجابة خبير على طلبك ${o.id}`, o.id); render();
  },
  feePreview() { const f = +K.val('ctFee') || 0, el = document.getElementById('feePrev'); if (el) el.textContent = f ? `يدفع العميل ${money(f * (1 + VAT))} • عمولة المنصة ${money(f * commission())} • صافي المحامي ${money(f * (1 - commission()))}` : ''; },
  issueContract() {
    const o = K.cur(), scope = K.val('ctScope'), fee = +K.val('ctFee'), days = +K.val('ctDays');
    if (!scope || !(fee > 0) || !(days > 0)) return toastErr('أكمل نطاق العمل والأتعاب والمدة');
    o.contract = { scope, fee, days, issuedAt: now(), issuedBy: me().id, acceptedAt: null }; touch(o);
    audit('إصدار عقد', o.id, `أتعاب ${money(fee)} — ${days} يوم`); push(`صدر عقد طلبك ${o.id} — يرجى مراجعته واعتماده`, o.id);
    render(); toast('طلع العقد ووصل العميل إشعار');
  },
  approve() {
    const o = K.cur(); o.ceoApproved = true; o.status = 'IN_PROGRESS'; touch(o);
    audit('اعتماد بدء التنفيذ', o.id, 'CEO Gate'); push(`بدأ العمل على طلبك ${o.id}`, o.id); notifyStaff(o.assignee, `اعتُمد بدء التنفيذ للطلب ${o.id} — ابدأ العمل`, o.id); render();
  },
  deliver() {
    const o = K.cur(), files = [...document.getElementById('resFiles').files].map(f => f.name), note = K.val('resNote');
    if (!files.length && !note) return toastErr('أرفق ملف المخرجات أو اكتب ملاحظة');
    o.result = { files: [...(o.result ? o.result.files : []), ...files], note, at: now(), by: me().id };
    files.forEach(f => o.docs.push({ name: f, size: 0, at: now(), by: 'team' }));
    o.requests.filter(r => r.type === 'revision' && r.status === 'open').forEach(r => { r.status = 'done'; r.reply = 'تم تنفيذ التعديل ورفع النتيجة المحدثة.'; });
    o.status = 'READY_DELIVERY'; touch(o);
    audit('إرسال نتيجة', o.id, files.join('، ') || note); push(`نتيجة طلبك ${o.id} جاهزة للتحميل`, o.id); render();
  },
  reply(rid) {
    const o = K.cur(), r = o.requests.find(x => x.id === rid), v = K.val('ar_' + rid); if (!v) return toastErr('اكتب الرد أولاً');
    r.reply = v; r.status = 'done'; touch(o); audit('رد على تنبيه', o.id, `${REQ_T[r.type]}: ${v}`); push(`رد خبير على تنبيهك في الطلب ${o.id}`, o.id); render();
  },
  unlock(rid) {
    const o = K.cur(), r = o.requests.find(x => x.id === rid);
    o.uploadUnlocked = true; r.status = 'done'; r.reply = K.val('ar_' + rid) || 'تم فتح صلاحية رفع المستند لك.'; touch(o);
    audit('فتح صلاحية الرفع', o.id, ''); push(`فُتحت لك صلاحية رفع مستند في الطلب ${o.id}`, o.id); render();
  },
  cancelByAdmin(rid, ok) {
    if (!ok) return ask(`تلغي الطلب «${K.cur().id}» بطلب العميل ؟`, "ما يرجع أبداً بعد الإلغاء.", "ألغِ الطلب", () => K.cancelByAdmin(rid, true));
    const o = K.cur(), r = o.requests.find(x => x.id === rid);
    r.status = 'done'; r.reply = K.val('ar_' + rid) || 'تمت الموافقة على طلب الإلغاء.'; o.status = 'CANCELLED'; touch(o);
    audit('إلغاء طلب', o.id, 'بقرار الإدارة بناءً على طلب مستقل من العميل'); push(`تم إلغاء طلبك ${o.id} بناءً على طلبك`, o.id); notifyStaff(o.assignee, `أُلغي الطلب ${o.id} بقرار الإدارة`, o.id); render();
  },
  note() { const o = K.cur(), v = K.val('noteIn'); if (!v) return; o.internal.push({ text: v, by: me().name, at: now() }); touch(o); render(); },
  cpReply(id) {
    const c = S.complaints.find(x => x.id === id), v = K.val('cr_' + id); if (!v) return;
    c.reply = v; c.by = me().name; c.status = 'done'; push('تم الرد على ' + (c.type === 'complaint' ? 'شكواك' : 'اقتراحك'), c.orderId || null); render();
  },
  setRole(uid) {
    const u = user(uid), r = K.val('role_' + uid); if (r === u.role) return;
    audit('تغيير صلاحيات', '—', `${u.name}: ${ROLES[u.role]} ← ${ROLES[r]}`); u.role = r;
    if (LAWYER_ROLES.includes(r) && !u.specialties) { u.specialties = []; u.active = true; }
    render(); toast('انحفظت الصلاحية');
  },
  toggleSpec(k) { const u = me(); u.specialties = u.specialties || []; u.specialties = u.specialties.includes(k) ? u.specialties.filter(x => x !== k) : [...u.specialties, k]; render(); },
  toggleAvail(uid) { const u = user(uid); u.active = u.active === false; audit('تغيير التوفر', '—', `${u.name}: ${u.active ? 'متاح' : 'غير متاح'}`); render(); },
  addLawyer() {
    const name = K.val('nlName'); if (!name) return toastErr('اكتب اسم المحامي');
    const specs = [...document.querySelectorAll('input[name=nlSpec]:checked')].map(x => x.value);
    const u = { id: nid('u'), name, role: K.val('nlType'), license: K.val('nlLic'), specialties: specs, active: true };
    S.users.push(u); audit('تغيير صلاحيات', '—', `إضافة ${name} بصفة ${ROLES[u.role]}`); render(); toast('انضاف المحامي');
  },
  payout(oid) {
    const o = order(oid), e = earning(o); o.payout = { at: now(), by: me().name };
    audit('تحويل أتعاب', o.id, `${money(e.net)} إلى ${uname(o.assignee)}`); notifyStaff(o.assignee, `تم تحويل أتعابك عن الطلب ${o.id}: ${money(e.net)}`, o.id); render();
  },
  setCommission() { S.settings.commission = Math.min(100, Math.max(0, +K.val('comIn') || 0)); audit('تعديل العمولة', '—', `${S.settings.commission}%`); render(); toast('انحفظ'); },
  setDelay() { S.settings.delayHours = Math.max(1, +K.val('delayH') || 48); render(); toast('انحفظ'); },
  time(ms) { S.settings.offset = ms ? (S.settings.offset || 0) + ms : 0; render(); toast('الوقت التجريبي: ' + fdt(now())); },
  reset(ok) {
    if (!ok) return ask("ترجّع البيانات التجريبية الأولى ؟", "كل اللي جرّبته في هذا المتصفح ينمسح.", "رجّع البيانات", () => K.reset(true));
    try { localStorage.removeItem(KEY); } catch (e) {}
    S = seed(); CV.screen = 'home'; AV.view = 'orders'; LV.view = 'home'; render(); toast('رجعت البيانات التجريبية');
  },
};

/* ================= مشترك ================= */
function showInvoice(id) {
  const o = order(id), p = o.payment, fee = o.contract.fee;
  modal(`<div class="invoice"><div class="row between"><h3 style="margin:0">{{i:receipt}} فاتورة ضريبية مبسطة</h3><b class="num">${p.invoice}</b></div>
    <p class="small muted">خبير — المكتب الحقوقي الرقمي • ${fdt(p.at)}</p>
    <table><tr><td>العميل</td><td>${esc(S.client.name)} (${S.client.fileNo})</td></tr><tr><td>الطلب</td><td>${o.id}</td></tr>
    <tr><td>الخدمة</td><td>${esc(o.contract.scope.slice(0, 70))}…</td></tr><tr><td>المبلغ قبل الضريبة</td><td>${money(fee)}</td></tr>
    <tr><td>ضريبة القيمة المضافة 15%</td><td>${money(fee * VAT)}</td></tr><tr><td><b>الإجمالي</b></td><td><b>${money(p.amount)}</b></td></tr>
    <tr><td>وسيلة الدفع</td><td>${p.method}</td></tr></table>
    <button class="btn block" style="margin-top:14px" onclick="closeModal()">إغلاق</button></div>`);
}
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; });
function showInstall() {
  const standalone = window.matchMedia && matchMedia('(display-mode: standalone)').matches;
  modal(`<h3 style="margin-top:0">{{i:smartphone}} تثبيت خبير كتطبيق</h3>
    ${standalone ? '<div class="banner ok">أنت تستخدم النسخة المثبتة من التطبيق.</div>' : ''}
    ${deferredPrompt ? '<button class="btn green block" onclick="doInstall()">تثبيت الآن</button>' : ''}
    <div class="stack" style="margin-top:12px">
      <div class="card"><h4>آيفون (Safari)</h4><div class="small">افتح موقع خبير ← زر المشاركة {{i:share-2}} ← «إضافة إلى الشاشة الرئيسية».</div></div>
      <div class="card"><h4>أندرويد (Chrome)</h4><div class="small">افتح موقع خبير ← القائمة ⋮ ← «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية».</div></div>
      <div class="card"><h4>الكمبيوتر (Chrome / Edge)</h4><div class="small">أيقونة التثبيت في شريط العنوان، أو القائمة ← «تثبيت خبير».</div></div>
    </div>
    <p class="small muted">يظهر التطبيق بأيقونة خبير ويفتح بملء الشاشة دون شريط المتصفح، تمهيداً لإطلاقه في App Store وGoogle Play.</p>
    <button class="btn ghost block" onclick="closeModal()">إغلاق</button>`);
}
async function doInstall() { if (!deferredPrompt) return; deferredPrompt.prompt(); try { await deferredPrompt.userChoice; } catch (e) {} deferredPrompt = null; closeModal(); }
function modal(h) { document.getElementById("modalRoot").innerHTML = `<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true">${icx(h)}</div></div>`; hintify(document.getElementById("modalRoot")); }
let askFn = null;
/* التأكيد قبل ما لا يُتراجع عنه: سؤال باسم الشيء ، وسطر عن النتيجة ، وزر خطر وزر إلغاء */
function ask(q, note, okLabel, fn) {
  askFn = fn;
  modal(`<h3 style="margin-top:0">${esc(q)}</h3><p class="muted">${esc(note)}</p><div class="row" style="justify-content:center"><button class="btn red" onclick="const f=askFn;askFn=null;closeModal();f&&f()">${esc(okLabel)}</button><button class="btn ghost" onclick="closeModal()">إلغاء</button></div>`);
}
function closeModal() { document.getElementById("modalRoot").innerHTML = ""; }
/* رسالة النجاح: شريط صغير أسفل الشاشة فوق التبويبات ، يختفي بعد ثانيتين ، أو 5 ثوانٍ مع «تراجع» */
function toast(m, undo) {
  const r = document.getElementById("toastRoot"); clearTimeout(toast._t);
  r.innerHTML = `<div class="toast ok" role="status">${ic("circle-check", 18)}<span>${esc(m)}</span>${undo ? `<button class="undo">${ic("undo-2", 16)} تراجع</button>` : ""}</div>`;
  if (undo) r.querySelector(".undo").onclick = () => { r.innerHTML = ""; undo(); };
  toast._t = setTimeout(() => { r.innerHTML = ""; }, undo ? 5000 : 2000);
}
/* رسالة الخطأ: بلون الخطر وتبقى حتى تُغلق ، وما كتبه المستخدم لا يضيع */
function toastErr(m) {
  const r = document.getElementById("toastRoot"); clearTimeout(toast._t);
  r.innerHTML = `<div class="toast err" role="alert">${ic("triangle-alert", 18)}<span>${esc(m)}</span><button class="undo" aria-label="إغلاق" onclick="this.parentNode.remove()">${ic("x", 16)}</button></div>`;
}
/* الإبلاغ عن خطأ: بلا دخول ، مع منع الإرسال المتكرر */
const reportBtn = () => `<div style="text-align:center;margin-top:16px"><button class="btn ghost sm" onclick="openReport()">${ic("flag", 16)} الإبلاغ عن خطأ</button></div>`;
function openReport() {
  modal(`<h3 style="margin-top:0">الإبلاغ عن خطأ</h3><div class="stack">
    <select id="rpType" aria-label="نوع الخطأ"><option>معلومة غير صحيحة</option><option>الصفحة ما تشتغل صح</option><option>نص غير واضح</option><option>أخرى</option></select>
    <textarea id="rpText" placeholder="وش الخطأ ، إن وجد"></textarea>
    <input type="tel" id="rpPhone" inputmode="numeric" placeholder="رقم تواصل إن وجد">
    <button class="btn block" onclick="sendReport()">أرسل</button></div>`);
}
function sendReport() {
  if (Date.now() - (sendReport._last || 0) < 30000) return toastErr("أرسلت بلاغ قبل شوي ، انتظر نص دقيقة");
  sendReport._last = Date.now();
  const v = id => (document.getElementById(id).value || "").trim();
  const ref = (PORTAL === "client" ? CV.orderId : V().orderId) || "";
  const phone = v("rpPhone").replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d));
  S.reports.push({ id: nid("r"), type: v("rpType"), text: v("rpText"), phone, page: `#${PORTAL} ${ref}`.trim(), at: now(), status: "new" });
  notifyRole("ceo", `بلاغ خطأ جديد${ref ? " على " + ref : ""}`, ref || undefined);
  closeModal(); save(); toast("شكراً ، وصلنا بلاغك");
}
function doneReport(id) { const r = S.reports.find(x => x.id === id); if (r) r.status = "done"; render(); toast("انحفظ"); }
function adminReports() {
  const list = S.reports.slice().reverse();
  return `<h3 style="margin:10px 0 0;text-align:center">بلاغات الأخطاء</h3>${list.map(r => `<div class="card"><div class="row between"><b>${esc(r.type)}</b>
      <span class="tag ${r.status === "new" ? "amber" : "green"}">${r.status === "new" ? "جديد" : "تمت المعالجة"}</span></div>
      ${r.text ? `<p>${esc(r.text)}</p>` : ""}<div class="small muted">${esc(r.page)} • ${fdt(r.at)}${r.phone && can("audit") ? ` • جوال المبلّغ : <span class="num">${esc(r.phone)}</span>` : ""}</div>
      ${r.status === "new" ? `<button class="btn ghost sm" style="margin-top:8px" onclick="doneReport('${r.id}')">تمت المعالجة</button>` : ""}</div>`).join("")
    || empty("flag", "ما فيه بلاغات")}`;
}
/* الصفحة الفارغة: رمز خافت وجملة وزر الخطوة التالية إن وجدت */
const empty = (icon, text, btn = "") => `<div class="empty-state">${ic(icon, 44)}<p>${text}</p>${btn}</div>`;
/* توضيح الحقل داخله نرسمه بأنفسنا (بدل توضيح المتصفح الذي يُسقط نقاط الياء في بعض الخطوط) */
function hintify(root) {
  root.querySelectorAll("input[placeholder]:not([type=file]):not([type=radio]):not([type=checkbox]), textarea[placeholder]").forEach(el => {
    if (el.parentNode.classList.contains("hint-wrap")) return;
    const w = document.createElement("span"); w.className = "hint-wrap" + (el.tagName === "TEXTAREA" ? " ta" : "");
    const hn = document.createElement("span"); hn.className = "hint"; hn.textContent = el.placeholder; el.removeAttribute("placeholder");
    el.parentNode.insertBefore(w, el); w.appendChild(el); w.appendChild(hn);
    const sync = () => w.classList.toggle("filled", !!el.value); el.addEventListener("input", sync); sync();
  });
}
function setPortal(p, fromHash) {
  PORTAL = ['client', 'lawyer', 'admin'].includes(p) ? p : 'client';
  if (!fromHash) { try { if (location.hash !== '#' + PORTAL) location.hash = PORTAL; } catch (e) {} }
  pushQueue = null; render(); scrollTo(0, 0);
}
function render() {
  if (typeof S === "undefined" || !S) return;
  purgeDrafts();
  const app = document.getElementById("app");
  app.innerHTML = icx(PORTAL === "lawyer" ? renderLawyer() : PORTAL === "admin" ? renderAdmin() : renderClient());
  hintify(app);
  document.querySelectorAll("#portalSeg button").forEach(b => b.classList.toggle("on", b.dataset.p === PORTAL));
  /* اختيار المستخدم التجريبي في الشريط التجريبي (بدل القائمة الجانبية) */
  const pool = PORTAL === "client" ? [] : S.users.filter(x => (PORTAL === "lawyer" ? LAWYER_ROLES : ADMIN_ROLES).includes(x.role));
  document.getElementById("whoBox").innerHTML = pool.length ? `<select class="who-sel" aria-label="الدخول باسم (تجريبي)" onchange="K.login(this.value)">${pool.map(x => `<option value="${x.id}" ${x.id === me().id ? "selected" : ""}>${esc(x.name)} ، ${ROLES[x.role]}</option>`).join("")}</select>` : "";
  document.getElementById("clock").textContent = (S.settings.offset ? "وقت تجريبي : " : "") + fdt(now());
  document.title = PORTAL === "client" && CV.screen === "home" ? "خبير" : `${PORTAL === "client" ? "العميل" : PORTAL === "lawyer" ? "المحامي" : "الإدارة"} · خبير`;
  if (pushQueue) { const q = pushQueue; setTimeout(() => { if (pushQueue === q) { pushQueue = null; const t = document.querySelector(".push"); t && t.remove(); } }, 3800); }
  save();
}

document.documentElement.lang = 'ar'; document.documentElement.dir = 'rtl';
load();
window.addEventListener('hashchange', () => setPortal(location.hash.slice(1), true));
setPortal((location.hash || '').slice(1), true);
setInterval(() => { document.getElementById('clock').textContent = (S.settings.offset ? 'وقت تجريبي: ' : '') + fdt(now()); }, 30000);
/* شاشة البداية: الشعار أبيض على خلفية داكنة لمدة قصيرة */
setTimeout(() => { const sp = document.getElementById("splash"); sp.classList.add("out"); setTimeout(() => sp.remove(), 400); }, 700);
</script>
