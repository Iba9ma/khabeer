<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e3a8a">
<meta name="description" content="خبير — المكتب الحقوقي الرقمي: اعرض مشكلتك ونتولى الباقي.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="خبير">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body><title>منصة خبير</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* الفكرة: ثلاث بوابات (عميل / محامٍ / إدارة) فوق بيانات واحدة — هوية كحلية رسمية بلمسة ورق قانوني.
   وضعان فاتح وداكن: يتبع إعداد الجهاز افتراضياً، وزر في الشريط العلوي يحفظ اختيار المستخدم. */
:root{
  color-scheme:light;
  --line2:#cdd5e3;--soft:#f3f5fa;--ink2:#334155;--accent-ink:#1e3a8a;--toast-bg:#101828;
  --warn-line:#f5d18a;--warn-ink:#7a4504;--info-ink:#1e3a8a;--ok-line:#9be3c4;--ok-ink:#065f46;--err-line:#f6b4b4;--err-ink:#991b1b;
  --st-review-bg:#fdf0cf;--st-review:#8a4b05;--st-prog:#1d3fa8;--st-ready-bg:#d6f5e6;--st-ready:#0b6b4a;--st-closed-bg:#e6eaf1;--st-cancel-bg:#fde1e1;--st-cancel:#9b1c1c;
  --avatar-bg:#e8eefc;--hover-line:#9db8f5;
  --navy:#1e3a8a;--navy-ink:#172554;--blue:#2563eb;--blue-50:#eef4ff;--blue-100:#dbe7ff;
  --green:#0f9f6e;--green-50:#ecfdf5;--red:#d42c2c;--red-50:#fef2f2;--amber:#b86e04;--amber-50:#fff8eb;
  --ink:#101828;--muted:#5b6478;--line:#e2e7f0;--bg:#f4f6fb;--card:#ffffff;--paper:#fbfaf6;
  --violet:#6d28d9;--violet-50:#f7f3ff;
  --font:'Tajawal',system-ui,'Segoe UI',Tahoma,sans-serif;
  --mono:Consolas,'Courier New',monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --blue:#3b82f6;--blue-50:#16213d;--blue-100:#1e2e55;
  --green-50:#0f2a22;--red-50:#331a1d;--amber-50:#33270f;--violet-50:#231b3a;--violet:#a78bfa;
  --ink:#e6eaf2;--ink2:#cbd3e1;--muted:#9aa6bd;--line:#2a3550;--line2:#3a4766;--bg:#0b1120;--card:#141c2f;--paper:#182238;--soft:#1a2338;
  --accent-ink:#9db8f5;--toast-bg:#26324d;
  --warn-line:#6b4a12;--warn-ink:#f6cf7f;--info-ink:#bcd0fb;--ok-line:#1e5c45;--ok-ink:#86e0b9;--err-line:#6b2a2a;--err-ink:#f6a5a5;
  --st-review-bg:#3a2c0e;--st-review:#f6cf7f;--st-prog:#bcd0fb;--st-ready-bg:#0f3326;--st-ready:#86e0b9;--st-closed-bg:#253049;--st-cancel-bg:#3a1a1c;--st-cancel:#f6a5a5;
  --avatar-bg:#25335a;--hover-line:#4a6fc0;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --blue:#3b82f6;--blue-50:#16213d;--blue-100:#1e2e55;
  --green-50:#0f2a22;--red-50:#331a1d;--amber-50:#33270f;--violet-50:#231b3a;--violet:#a78bfa;
  --ink:#e6eaf2;--ink2:#cbd3e1;--muted:#9aa6bd;--line:#2a3550;--line2:#3a4766;--bg:#0b1120;--card:#141c2f;--paper:#182238;--soft:#1a2338;
  --accent-ink:#9db8f5;--toast-bg:#26324d;
  --warn-line:#6b4a12;--warn-ink:#f6cf7f;--info-ink:#bcd0fb;--ok-line:#1e5c45;--ok-ink:#86e0b9;--err-line:#6b2a2a;--err-ink:#f6a5a5;
  --st-review-bg:#3a2c0e;--st-review:#f6cf7f;--st-prog:#bcd0fb;--st-ready-bg:#0f3326;--st-ready:#86e0b9;--st-closed-bg:#253049;--st-cancel-bg:#3a1a1c;--st-cancel:#f6a5a5;
  --avatar-bg:#25335a;--hover-line:#4a6fc0;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14.5px;line-height:1.65}
body{direction:rtl}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:90;background:var(--navy-ink)}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1,h2,h3{text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.demobar{background:var(--navy-ink);color:#c7d2fe;font-size:12.5px}
.demobar .in{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:7px;max-width:1280px;margin:0 auto}
.demobar .lbl{font-weight:700;letter-spacing:.02em}
.seg{display:flex;background:rgba(255,255,255,.1);border-radius:10px;padding:3px;gap:2px}
.seg button{background:none;border:0;color:#c7d2fe;padding:5px 12px;border-radius:8px;font-weight:700;font-size:12.5px}
.seg button.on{background:#fff;color:#1e3a8a}
.demobar .clock{margin-inline-start:auto;color:#a5b4fc}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.card h3{margin:0 0 10px;font-size:15.5px}
.card h4{margin:0 0 8px;font-size:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.btn{border:0;border-radius:10px;padding:9px 16px;font-weight:700;background:var(--blue);color:#fff;transition:filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn.block{width:100%;padding:12px}
.btn.lg{padding:13px 22px;font-size:15.5px}
.btn.ghost{background:var(--card);color:var(--blue);border:1px solid var(--blue-100)}
.btn.green{background:var(--green)}
.btn.red{background:var(--red)}
.btn.dark{background:var(--navy)}
.btn.light{background:var(--card);color:var(--accent-ink)}
.btn.sm{padding:5px 11px;font-size:12.5px;border-radius:8px}
.btn.danger-ghost{background:var(--card);color:var(--red);border:1px solid var(--err-line)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;border:1px solid var(--line2);border-radius:10px;padding:9px 11px;background:var(--card)}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue-100);border-color:var(--blue)}
label.f{display:block;font-weight:700;font-size:12.5px;margin:10px 0 4px}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.st-draft{background:var(--soft);color:var(--muted);border:1px dashed #94a3b8}
.st-review{background:var(--st-review-bg);color:var(--st-review)}
.st-progress{background:var(--blue-100);color:var(--st-prog)}
.st-ready{background:var(--st-ready-bg);color:var(--st-ready)}
.st-closed{background:var(--st-closed-bg);color:var(--ink2)}
.st-cancel{background:var(--st-cancel-bg);color:var(--st-cancel)}
.tag{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:6px;background:var(--soft);color:var(--muted);font-weight:700;white-space:nowrap}
.tag.red{background:var(--red-50);color:var(--red)}
.tag.amber{background:var(--amber-50);color:var(--amber)}
.tag.blue{background:var(--blue-50);color:var(--blue)}
.tag.green{background:var(--green-50);color:var(--green)}
.tag.violet{background:var(--violet-50);color:var(--violet)}
.banner{border-radius:12px;padding:10px 14px;font-size:13px}
.banner.warn{background:var(--amber-50);border:1px solid var(--warn-line);color:var(--warn-ink)}
.banner.info{background:var(--blue-50);border:1px solid var(--blue-100);color:var(--info-ink)}
.banner.ok{background:var(--green-50);border:1px solid var(--ok-line);color:var(--ok-ink)}
.banner.err{background:var(--red-50);border:1px solid var(--err-line);color:var(--err-ink)}
.kv{display:grid;grid-template-columns:120px 1fr;gap:5px 12px;font-size:13.5px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 10px;text-align:center;font-weight:700}
.choice:hover{border-color:var(--blue);background:var(--blue-50)}
.choice .ic{font-size:24px;display:block}
.choice small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.choice.wide{grid-column:1/-1;border-style:dashed;border-color:var(--hover-line);background:var(--blue-50)}
.steps{display:flex;gap:5px}
.steps div{flex:1;height:5px;border-radius:4px;background:var(--line)}
.steps div.on{background:var(--blue)}
.qa{font-size:13px;border-bottom:1px dashed var(--line);padding:7px 0;display:flex;gap:8px;align-items:flex-start}
.qa .q{color:var(--muted);flex:1;min-width:0}
.qa .a{font-weight:700}
.qbox{background:var(--card);border:2px solid var(--blue-100);border-radius:14px;padding:16px}
.qbox .qt{font-weight:800;font-size:16px;margin-bottom:12px}
.opts{display:flex;flex-direction:column;gap:7px}
.opts button{background:var(--card);border:1px solid var(--line2);border-radius:10px;padding:11px 12px;text-align:right;font-weight:600}
.opts button:hover{border-color:var(--blue);background:var(--blue-50)}
.timeline{display:flex;justify-content:space-between;position:relative}
.timeline:before{content:"";position:absolute;top:10px;right:9%;left:9%;height:2px;background:var(--line)}
.timeline div{flex:1;text-align:center;font-size:11.5px;color:var(--muted);position:relative}
.timeline div b{display:block;width:22px;height:22px;border-radius:50%;background:var(--line2);margin:0 auto 4px;color:#fff;font-size:11px;line-height:22px}
.timeline div.done b{background:var(--green)}
.timeline div.cur b{background:var(--blue);box-shadow:0 0 0 4px var(--blue-100)}
.timeline div.cur{color:var(--blue);font-weight:700}
.req{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;background:var(--card)}
.req.team{border-color:var(--blue-100);background:var(--blue-50)}
.req .meta{font-size:11.5px;color:var(--muted)}
.req .reply{margin-top:6px;padding:6px 9px;background:var(--soft);border-radius:8px;border-right:3px solid var(--green)}
.files{list-style:none;padding:0;margin:0}
.files li{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;padding:7px 0;border-bottom:1px dashed var(--line)}
.files li span:first-child{min-width:0;overflow-wrap:anywhere}
.contract{border:1.5px solid var(--navy);border-radius:14px;padding:16px;background:var(--paper)}
.contract .hd{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:10px}
.contract .total{font-size:22px;font-weight:800;color:var(--accent-ink)}
.pay-opts{display:flex;gap:8px;margin:10px 0}
.pay-opts label{flex:1;border:1px solid var(--line2);border-radius:10px;padding:10px 4px;text-align:center;font-weight:800;cursor:pointer;background:var(--card);position:relative}
.pay-opts input{position:absolute;opacity:0;pointer-events:none}
.pay-opts label:has(input:checked){border-color:var(--blue);background:var(--blue-50);color:var(--blue)}
.empty{text-align:center;color:var(--muted);padding:36px 12px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.kpi b{display:block;font-size:24px;color:var(--accent-ink);font-variant-numeric:tabular-nums;line-height:1.3}
.kpi span{font-size:12.5px;color:var(--muted)}
.kpi.alert{border-color:var(--err-line);background:var(--red-50)}
.kpi.alert b{color:var(--red)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:700;color:var(--ink2)}
.chips button.on{background:var(--navy);color:#fff;border-color:var(--accent-ink)}
.t-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table.t{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
table.t th{background:var(--soft);text-align:right;padding:9px 12px;font-size:12px;color:var(--ink2);border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:var(--blue-50)}
table.t tr.late td{background:var(--red-50)}
table.t td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.ai{border:1px dashed var(--violet);background:var(--violet-50);border-radius:14px;padding:14px}
.ai h4{color:var(--violet);margin:0 0 6px}
.mark{background:#fff;color:#1e3a8a;border-radius:9px;width:34px;height:34px;display:grid;place-items:center;font-weight:800;font-size:18px;flex:none}
.bell{position:relative}
.bell i{position:absolute;top:-5px;left:-7px;background:var(--red);color:#fff;font-style:normal;font-size:10px;border-radius:9px;padding:0 5px;min-width:17px;line-height:16px;text-align:center}

.site-h{background:var(--navy);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:40;box-shadow:0 2px 10px rgba(16,24,40,.12)}
.site-h .in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:18px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none}
.brand b{display:block;font-size:19px;line-height:1.1}
.brand small{display:block;font-size:11.5px;color:#a9c0f5}
.site-nav{display:flex;gap:4px}
.site-nav button{background:none;border:0;color:#c9d7fb;padding:7px 12px;border-radius:9px;font-weight:700}
.site-nav button:hover{background:rgba(255,255,255,.08)}
.site-nav button.on{background:rgba(255,255,255,.14);color:#fff}
.site-tools{margin-inline-start:auto;display:flex;align-items:center;gap:8px}
.icon-btn{background:rgba(255,255,255,.1);border:0;color:#fff;border-radius:10px;padding:7px 11px;font-weight:700;font-size:13px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--avatar-bg);color:var(--accent-ink);display:grid;place-items:center;font-weight:800}
.site-main .in{max-width:1080px;margin:0 auto;padding-block:22px 40px}
.hero{background:linear-gradient(160deg,var(--navy) 0%,#2449b5 100%);color:#fff;border-radius:20px;padding:30px;display:grid;grid-template-columns:1.25fr 1fr;gap:28px;align-items:center}
.hero h1{font-size:30px;line-height:1.3;margin:0 0 10px;font-weight:800}
.hero p{color:#d6e2ff;margin:0 0 18px;max-width:48ch}
.how{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:s}
.how li{counter-increment:s;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:10px 12px;display:flex;gap:12px;align-items:center}
.how li:before{content:counter(s);width:28px;height:28px;border-radius:50%;background:#fff;color:#1e3a8a;font-weight:800;display:grid;place-items:center;flex:none}
.how b{display:block}
.how span{font-size:12.5px;color:#c9d7fb}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:26px 0 12px}
.sec-h h2{margin:0;font-size:19px}
.ogrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.ocard{display:flex;flex-direction:column;gap:6px;width:100%;text-align:right;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.ocard:hover{border-color:var(--hover-line);box-shadow:0 4px 14px rgba(37,99,235,.08)}
.narrow{max-width:700px;margin:0 auto}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:16px;align-items:start}
.draft-bar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:5}
.bnav{display:none}
.push{position:fixed;top:calc(env(safe-area-inset-top,0px) + 70px);left:max(16px,env(safe-area-inset-left,0px));width:min(360px,calc(100% - 32px));background:var(--toast-bg);color:#fff;border-radius:14px;padding:11px 14px;font-size:13px;box-shadow:0 10px 26px rgba(0,0,0,.25);z-index:80;cursor:pointer;animation:drop .3s ease}
.push small{display:block;color:#94a3b8;font-size:11px}
@keyframes drop{from{transform:translateY(-14px);opacity:0}to{transform:none;opacity:1}}

.con{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100vh - 40px)}
.con-side{background:#0e1630;color:#c5cde0;padding:16px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
.con-side.lawyer{background:#13241f}
.con-brand{display:flex;gap:10px;align-items:center;padding:4px 6px 14px}
.con-brand b{color:#fff;display:block;font-size:17px;line-height:1.1}
.con-brand small{font-size:11.5px;color:#8fa0c4}
.who{background:rgba(255,255,255,.06);border-radius:12px;padding:10px;margin-bottom:10px}
.who label{display:block;font-size:11px;color:#8fa0c4;margin-bottom:4px}
.who select{background:#0b1226;color:#fff;border-color:#2c3a5e;font-size:13px;padding:6px}
.con-side.lawyer .who select{background:#0d1a16;border-color:#2b4a40}
.who .role{font-size:11.5px;color:#9db8f5;margin-top:6px}
.con-side.lawyer .who .role{color:#7fd8b5}
.con-nav{display:flex;flex-direction:column;gap:2px}
.con-nav button{background:none;border:0;color:#c5cde0;text-align:right;padding:9px 10px;border-radius:9px;display:flex;justify-content:space-between;align-items:center;gap:6px;font-weight:600;white-space:nowrap}
.con-nav button:hover{background:rgba(255,255,255,.07)}
.con-nav button.on{background:var(--blue);color:#fff;font-weight:800}
.con-side.lawyer .con-nav button.on{background:var(--green)}
.con-nav button i{font-style:normal;background:var(--red);color:#fff;border-radius:9px;font-size:10.5px;padding:0 6px}
.con-nav button.lock{opacity:.4}
.con-foot{margin-top:auto;font-size:11px;color:#6b7a9c;padding:8px}
.con-main{padding-block:20px 40px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));min-width:0;display:flex;flex-direction:column;gap:14px}
.con-main h2{margin:0;font-size:20px}
.a-grid{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:14px;align-items:start}
.lcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.denied{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:40px;text-align:center;color:var(--muted)}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:12.5px;background:var(--card);cursor:pointer}
.checks label:has(input:checked){border-color:var(--green);background:var(--green-50);color:var(--green);font-weight:700}
.checks input{margin:0 0 0 4px}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-weight:700}
.switch input{width:18px;height:18px}

.overlay{position:fixed;inset:0;background:rgba(16,24,40,.5);display:grid;place-items:center;z-index:100;padding:16px}

(function(){const t=savedTheme();if(t==='dark'||t==='light')document.documentElement.dataset.theme=t;paintThemeBtn();if(window.matchMedia)matchMedia('(prefers-color-scheme: dark)').addEventListener('change',paintThemeBtn)})();

function audit(action, orderId, details = '', who) { S.audit.push({ at: now(), user: who || (me() || {}).name || 'النظام', action, orderId, details }); }
let pushQueue = null;
function push(text, orderId) { const n = { id: nid('n'), text, orderId, at: now(), read: false }; S.notifs.push(n); if (PORTAL === 'client') pushQueue = n; }
function notifyStaff(uid, text, orderId) { if (uid) S.snotifs.push({ id: nid('s'), uid, text, orderId, at: now(), read: false }); }
function notifyRole(role, text, orderId) { S.users.filter(u => u.role === role).forEach(u => notifyStaff(u.id, text, orderId)); }
function notifyTeam(o, text) { o.assignee ? notifyStaff(o.assignee, text, o.id) : notifyRole('reception', text, o.id); }
function touch(o) { o.lastActionAt = now(); o.updatedAt = now(); }
function purgeDrafts() {
  const before = S.orders.length;
  S.orders = S.orders.filter(o => !(o.status === 'DRAFT' && now() - o.createdAt > DRAFT_TTL));
  if (S.orders.length !== before) {
    audit('حذف مسودة آلياً', '—', `حُذفت ${before - S.orders.length} مسودة تجاوزت 168 ساعة`, 'النظام');
    if (CV.screen === 'wizard' && !order(CV.orderId)) CV.screen = 'home';
  }
}
function stage(o) {
  if (o.status === 'UNDER_REVIEW') {
    if (o.freeAnswer) return { t: 'تمت الإجابة', who: 'none' };
    if (!o.contract) {
      if (!o.assignee) return { t: 'لدى الإدارة للفرز والإسناد', who: 'admin' };
      if (!o.assignAccepted) return { t: 'بانتظار قبول المحامي للإسناد', who: 'lawyer' };
      return { t: 'لدى المحامي للدراسة الأولية', who: 'lawyer' };
    }
    if (!o.contract.acceptedAt) return { t: 'بانتظار اعتماد العميل للعقد', who: 'client' };
    if (!o.payment) return { t: 'بانتظار سداد الأتعاب', who: 'client' };
    return { t: 'بانتظار اعتماد المدير التنفيذي', who: 'ceo' };
  }
  if (o.status === 'IN_PROGRESS') return { t: o.revisions.length ? `تنفيذ التعديل رقم ${o.revisions.length}` : 'العمل جارٍ لدى المحامي', who: 'lawyer' };
  if (o.status === 'READY_DELIVERY') return { t: 'بانتظار استلام العميل', who: 'client' };
  return { t: '', who: 'none' };
}
const isLate = o => ['admin', 'lawyer', 'ceo'].includes(stage(o).who) && now() - o.lastActionAt > S.settings.delayHours * HOUR;
const openClientReqs = o => o.requests.filter(r => r.from === 'client' && r.status === 'open');
const openTeamReqs = o => o.requests.filter(r => r.from === 'team' && r.status === 'open');
const clientNeedsAction = o => stage(o).who === 'client' || openTeamReqs(o).length > 0;
const canClientUpload = o => o.status === 'DRAFT' || (o.status === 'UNDER_REVIEW' && !o.payment) || o.uploadUnlocked;
const lawyerNeedsAction = o => o.assignAccepted && (stage(o).who === 'lawyer' || openClientReqs(o).length > 0);
const activeLoad = uid => S.orders.filter(o => o.assignee === uid && ['UNDER_REVIEW', 'IN_PROGRESS', 'READY_DELIVERY'].includes(o.status) && !o.freeAnswer).length;
function summary(o) {
  const a = o.answers;
  return { otherParty: a.otherParty || '', subject: a.subject || (o.freeText ? o.freeText.slice(0, 90) : ''), amount: a.amount ? money(a.amount) : '', date: a.date || '' };
}
const orderTitle = o => { const s = summary(o); return `${catLabel(o.category)}${s.subject ? ' — ' + s.subject.slice(0, 40) : ''}`; };
function earning(o) {
  if (!o.contract || !o.payment) return null;
  const fee = o.contract.fee, com = fee * commission();
  const status = o.status === 'CANCELLED' ? 'ملغاة' : o.status !== 'CLOSED' ? 'معلّقة' : o.payout ? 'محوّلة' : 'مستحقة';
  return { fee, com, net: fee - com, status };
}
const earnTag = s => `<span class="tag ${s === 'محوّلة' ? 'green' : s === 'مستحقة' ? 'blue' : s === 'ملغاة' ? 'red' : 'amber'}">${s}</span>`;

function aiAssist(o) {
  const txt = [o.freeText, o.notes, ...Object.values(o.answers)].join(' ');
  const rules = [
    ['labor', /عمل|راتب|رواتب|أجر|أجور|فصل|كفيل|مكافأة|نهاية الخدمة|إخلاء طرف/g],
    ['realestate', /إيجار|ايجار|عقار|شقة|مستأجر|مؤجر|أرض|مقاول|صك/g],
    ['commercial', /شركة|شريك|شراكة|توريد|فاتورة|دين|تجار|مؤسسة|سجل تجاري|شيك/g],
    ['family', /طلاق|خلع|نفقة|حضانة|زوج|إرث|ورث|تركة|زيارة|طليق/g],
    ['admin', /وزارة|بلدية|أمانة|قرار|مخالفة|غرامة|ترخيص|حكومي|هيئة|إغلاق/g],
  ];
  const scores = rules.map(([k, re]) => [k, (txt.match(re) || []).length]).sort((a, b) => b[1] - a[1]);
  const top = scores[0][1] > 0 ? scores[0][0] : null;
  const route = {
    labor: 'التسوية الودية عبر منصة «ودّي» ثم المحكمة العمالية',
    realestate: o.answers.ejar === 'نعم' ? 'محكمة التنفيذ مباشرة (عقد إيجار موثق = سند تنفيذي)' : 'المحكمة العامة / مركز التحكيم العقاري',
    commercial: 'المحكمة التجارية (مع التحقق من شرط التحكيم في العقد)',
    family: 'محكمة الأحوال الشخصية عبر «ناجز»',
    admin: 'التظلم أمام الجهة ثم المحكمة الإدارية ضمن المدد النظامية',
  };
  const amounts = (txt.match(/\d[\d,]{2,}/g) || []).map(x => x.replace(/,/g, ''));
  const s = summary(o), missing = [];
  if (!s.otherParty) missing.push('الطرف الآخر');
  if (!s.date) missing.push('التاريخ');
  if (!o.docs.length) missing.push('مستندات داعمة');
  const flags = [];
  if (o.answers.date) {
    const days = (now() - new Date(o.answers.date).getTime()) / DAY;
    if (o.category === 'labor' && days > 300) flags.push('⚠️ تحقق من مدة سماع الدعوى العمالية (12 شهراً من انتهاء العلاقة)');
    if (o.category === 'admin' && days > 50) flags.push('⚠️ تحقق من مدة التظلم/الاعتراض (60 يوماً)');
  }
  return { suggested: top, mismatch: top && o.category !== 'free' && top !== o.category, route: route[top || o.category] || 'يحدده المحامي', amounts, missing, flags };
}
function recommend(o) {
  const cat = o.category !== 'free' ? o.category : aiAssist(o).suggested;
  return lawyers().filter(u => u.active !== false)
    .map(u => ({ u, match: (u.specialties || []).includes(cat), load: activeLoad(u.id) }))
    .sort((a, b) => (b.match - a.match) || (a.load - b.load));
}

  },
  rmDoc(i) { C.cur().docs.splice(i, 1); render(); },
  submit() {
    const o = C.cur(); o.status = 'UNDER_REVIEW'; o.submittedAt = now(); touch(o);
    audit('إنشاء طلب', o.id, `إرسال الطلب — ${catLabel(o.category)}`, 'العميل');
    push('تم استلام طلبك، وجارٍ مراجعته من فريق خبير، وسيتم التواصل معك قريبًا.', o.id);
    notifyRole('reception', `طلب جديد ${o.id} بانتظار الفرز والإسناد`, o.id);
    CV.screen = 'submitted'; render(); scrollTo(0, 0);
  },
  delDraft(ok) {
    if (!ok) return ask('حذف المسودة نهائياً؟', () => C.delDraft(true));
    S.orders = S.orders.filter(o => o.id !== CV.orderId); CV.screen = 'home'; render();
  },
  acceptContract() {
    const o = C.cur(); o.contract.acceptedAt = now(); o.updatedAt = now();
    audit('اعتماد عقد', o.id, `موافقة على السعر والنطاق والمدة — ${money(o.contract.fee)} / ${o.contract.days} يوم`, 'العميل');
    notifyStaff(o.assignee, `اعتمد العميل عقد الطلب ${o.id}`, o.id);
    render(); toast('تم اعتماد العقد — يمكنك الآن السداد');
  },
  pay() {
    const o = C.cur(), m = (document.querySelector('input[name=pm]:checked') || {}).value || 'مدى';
    const inv = 'INV-' + new Date(now()).getFullYear() + '-' + String(++S.invoices).padStart(4, '0');
    o.payment = { method: m, amount: o.contract.fee * (1 + VAT), at: now(), invoice: inv }; touch(o);
    audit('دفع', o.id, `${m} — ${money(o.payment.amount)} — ${inv}`, 'العميل');
    push(`تم سداد أتعاب الطلب ${o.id} وإصدار الفاتورة ${inv}`, o.id);
    notifyRole('ceo', `الطلب ${o.id} مسدد وبانتظار اعتمادك لبدء التنفيذ`, o.id);
    notifyStaff(o.assignee, `سدد العميل أتعاب الطلب ${o.id} — بانتظار اعتماد المدير`, o.id);
    render(); showInvoice(o.id);
  },
  acceptResult() {
    const o = C.cur(); o.status = 'CLOSED'; touch(o);
    audit('إغلاق الطلب', o.id, 'استلام نهائي من العميل', 'العميل');
    notifyStaff(o.assignee, `أغلق العميل الطلب ${o.id} — أتعابك أصبحت مستحقة`, o.id);
    render(); toast('تم إغلاق الطلب. شكراً لثقتك بخبير');
  },
  toggleRevise() { CV.reviseOpen = !CV.reviseOpen; render(); },
  revise() {
    const o = C.cur(), v = document.getElementById('reviseText').value.trim();
    if (!v) return toast('وضّح التعديل المطلوب');
    o.revisions.push({ text: v, at: now() });
    o.requests.push({ id: nid('r'), from: 'client', type: 'revision', text: v, at: now(), status: 'open' });
    o.status = 'IN_PROGRESS'; touch(o); CV.reviseOpen = false;
    audit('طلب تعديل', o.id, `المراجعة رقم ${o.revisions.length}: ${v}`, 'العميل');
    notifyStaff(o.assignee, `طلب العميل تعديلاً على الطلب ${o.id} (رقم ${o.revisions.length})`, o.id);
    if (o.revisions.length === 3) push(`تنبيه: هذه المرة الثالثة لطلب المراجعة على الطلب ${o.id}`, o.id);
    render(); toast('تم إرسال طلب التعديل');
  },
  request() {
    const o = C.cur(), type = document.getElementById('rqType').value, text = document.getElementById('rqText').value.trim();
    if (!text) return toast('اكتب الطلب أولاً');
    o.requests.push({ id: nid('r'), from: 'client', type, text, at: now(), status: 'open' }); touch(o);
    audit('تنبيه من العميل', o.id, `${REQ_T[type]}: ${text}`, 'العميل');
    notifyTeam(o, `${REQ_T[type]} من العميل في الطلب ${o.id}`);
    if (type === 'change') notifyRole('ceo', `طلب تعديل/إلغاء على الطلب ${o.id} بانتظار قرارك`, o.id);
    render(); toast('تم إرسال التنبيه');
  },
  replyTeam(rid) {
    const o = C.cur(), r = o.requests.find(x => x.id === rid), v = document.getElementById('rep_' + rid).value.trim();
    if (!v) return; r.reply = v; r.status = 'done'; touch(o);
    audit('تعديل بيانات', o.id, `استكمال من العميل: ${v}`, 'العميل'); notifyTeam(o, `استكمل العميل البيانات في الطلب ${o.id}`); render();
  },
  cancel(ok) {
    if (!ok) return ask('إلغاء الطلب؟ لا يمكن التراجع عن الإلغاء.', () => C.cancel(true));
    const o = C.cur(); o.status = 'CANCELLED'; touch(o); audit('إلغاء طلب', o.id, 'إلغاء من العميل قبل صدور العقد', 'العميل');
    notifyTeam(o, `ألغى العميل الطلب ${o.id}`); render();
  },
  complain() {
    const text = document.getElementById('cpText').value.trim(); if (!text) return toast('اكتب الشكوى أو الاقتراح');
    const c = { id: nid('cp'), type: document.getElementById('cpType').value, orderId: document.getElementById('cpOrder').value, text, at: now(), status: 'open' };
    const lbl = c.type === 'complaint' ? 'شكوى' : 'اقتراح';
    S.complaints.push(c); notifyRole('reception', `${lbl} جديد من العميل`, c.orderId); notifyRole('ceo', `${lbl} جديد من العميل`, c.orderId);
    render(); toast('تم الإرسال');
  },
};

/* شريط التبويبات السفلي للبوابات الداخلية: 4 تبويبات + «المزيد» إن زادت */
const splitNav = t => { const m = t.match(/^(\S+)\s+(.*)$/); return m ? [m[1], m[2]] : ['•', t]; };
const navOn = k => { const v = V(); return v.view === k || (k === 'orders' && v.view === 'order'); };
function tabBtn([k, t, b, ok = true]) {

}
function consoleTabs(nav, lw) {
  window._moreNav = nav;

  const main = nav.slice(0, 4), rest = nav.slice(4);

  return `<nav class="bnav">${main.map(tabBtn).join('')}<button class="${restOn ? 'on' : ''}" onclick="moreTabs()"><b>☰</b><span>المزيد</span>${restBadge ? `<i>${restBadge}</i>` : ''}</button></nav>`;

}

        <details style="margin-top:8px"><summary class="small" style="cursor:pointer">جميع الأسئلة والإجابات (${Object.keys(o.answers).length})</summary>
          ${Object.entries(o.answers).map(([k, v]) => `<div class="qa"><span class="q">${esc(qText(o, k))}</span><span class="a">${esc(v || 'لم يُحدد')}</span></div>`).join('')}</details></div>
      ${o.freeAnswer ? `<div class="card" style="border-color:var(--ok-line)"><h4>💡 الإجابة المجانية المرسلة</h4>${esc(o.freeAnswer.text)}<div class="small muted">${esc(uname(o.freeAnswer.by))} • ${fdt(o.freeAnswer.at)}</div></div>` : ''}
      ${o.contract ? contractCard(o, false) + `<div class="small muted">أصدره ${esc(uname(o.contract.issuedBy))} • الدفع: ${o.payment ? `✔ ${o.payment.method} • <a href="#${PORTAL}" onclick="showInvoice('${o.id}');return false">${o.payment.invoice}</a>` : 'لم يُسدد'} • اعتماد التنفيذ: ${o.ceoApproved ? '✔' : 'بانتظار'}</div>` : ''}
      ${o.result ? resultCard(o) : ''}
      <div class="card"><h3>📌 التنبيهات الهيكلية</h3><div class="stack">${reqs || '<div class="small muted">لا توجد</div>'}</div></div>
      <div class="card"><h3>📎 المستندات</h3><ul class="files">${o.docs.map(d => `<li><span>${d.by === 'client' ? '📄' : '🏢'} ${esc(d.name)}</span><span class="small muted">${d.by === 'client' ? 'العميل' : 'خبير'} • ${fdt(d.at)}</span></li>`).join('') || '<li class="muted">—</li>'}</ul>
        <div class="small muted" style="margin-top:8px">رفع العميل المباشر: ${canClientUpload(o) ? '<span class="tag green">مفتوح</span>' : '<span class="tag">مغلق</span>'}</div></div>
      <div class="card"><h3>🗒️ ملاحظات داخلية (لا تظهر للعميل)</h3><div class="stack">
        ${o.internal.map(n => `<div class="req"><div>${esc(n.text)}</div><div class="meta">${esc(n.by)} • ${fdt(n.at)}</div></div>`).join('')}
        <div class="row"><input type="text" id="noteIn" class="grow" aria-label="ملاحظة داخلية" placeholder="أضف ملاحظة..." onkeydown="if(event.key==='Enter')K.note()"><button class="btn sm" onclick="K.note()">إضافة</button></div></div></div>
    </div><div class="stack">
      <div class="ai"><h4>🤖 المساعد الخلفي (AI) — داخلي فقط</h4>
        <div class="small" style="color:var(--violet);margin-bottom:8px">مساند للفرز والاستخراج والمراجعة. لا يُعرض للعميل ولا يُنسب إليه.</div>
        <dl class="kv small"><dt>تصنيف مقترح</dt><dd>${ai.suggested ? catLabel(ai.suggested) : 'غير كافٍ'} ${ai.mismatch ? '<span class="tag amber">يختلف عن اختيار العميل</span>' : ''}</dd>
        <dt>المسار المحتمل</dt><dd>${ai.route}</dd><dt>مبالغ مستخرجة</dt><dd class="num">${ai.amounts.length ? ai.amounts.map(money).join('، ') : '—'}</dd>
        <dt>نواقص</dt><dd>${ai.missing.length ? ai.missing.join('، ') : 'لا يوجد'}</dd></dl>
        ${ai.flags.map(f => `<div class="small" style="margin-top:4px">${f}</div>`).join('')}</div>
      ${act}
      ${tlog.length ? `<div class="card"><h4>🛡️ سجل إجراءات الطلب</h4>${tlog.map(a => `<div class="qa small"><span class="q">${fdt(a.at)}<br>${esc(a.user)}</span><span class="a">${esc(a.action)}</span></div>`).join('')}</div>` : ''}
    </div></div>`;
}

const K = {
  login(id) { if (PORTAL === 'lawyer') { S.curLawyer = id; LV.view = 'home'; } else S.curAdmin = id; render(); toast(`تم الدخول باسم ${me().name}`); },
  go(v) { V().view = v; render(); scrollTo(0, 0); },
  open(id) { const v = V(); v.view = 'order'; v.orderId = id; render(); scrollTo(0, 0); },
  filter(f) { V().filter = f; render(); },
  openNotif(id) {
    const n = S.snotifs.find(x => x.id === id); if (n) n.read = true;
    const o = n && n.orderId && order(n.orderId);
    o && (PORTAL === 'admin' || o.assignee === me().id) ? K.open(o.id) : render();
  },
  cur() { return order(V().orderId); },
  val(id) { const el = document.getElementById(id); return el ? el.value.trim() : ''; },
  assign() {
    const o = K.cur(), to = K.val('assignSel'); if (!to || to === o.assignee) return toast('اختر محامياً مختلفاً');
    const from = o.assignee;
    o.assignee = to; o.triaged = true; o.assignAccepted = !!o.contract; touch(o);
    audit(from ? 'نقل طلب' : 'فرز وإسناد', o.id, from ? `من ${uname(from)} إلى ${uname(to)}` : `إلى ${uname(to)}`);
    notifyStaff(to, o.contract ? `نُقل إليك الطلب ${o.id}` : `أُسند إليك الطلب ${o.id} — بانتظار قبولك`, o.id);
    if (from) notifyStaff(from, `نُقل الطلب ${o.id} إلى محامٍ آخر`, o.id);
    render(); toast('تم الإسناد وإشعار المحامي');
  },
  accept() { const o = K.cur(); o.assignAccepted = true; touch(o); audit('قبول الإسناد', o.id, ''); render(); toast('تم قبول الإسناد — ابدأ الدراسة الأولية'); },
  decline() {
    const o = K.cur(), why = K.val('declineWhy'); if (!why) return toast('اذكر سبب الاعتذار');
    audit('اعتذار عن الإسناد', o.id, why); o.assignee = null; o.assignAccepted = false; touch(o);
    notifyRole('reception', `اعتذر ${me().name} عن الطلب ${o.id}: ${why}`, o.id); notifyRole('ceo', `اعتذار عن الطلب ${o.id} — يحتاج إعادة إسناد`, o.id);
    LV.view = 'home'; render(); toast('أُرسل الاعتذار للإدارة');
  },
  askClient() {
    const o = K.cur(), v = K.val('needText'); if (!v) return toast('اكتب المطلوب من العميل');
    o.requests.push({ id: nid('r'), from: 'team', type: 'complete', text: v, at: now(), status: 'open' }); o.uploadUnlocked = true; touch(o);
    audit('طلب استكمال', o.id, v); push(`مطلوب استكمال بيانات لطلبك ${o.id}`, o.id); render(); toast('أُرسل التنبيه للعميل');
  },
  freeAnswer() {
    const o = K.cur(), v = K.val('faText'); if (!v) return toast('اكتب الإجابة أولاً');
    o.freeAnswer = { text: v, at: now(), by: me().id }; o.status = 'CLOSED'; o.assignee = o.assignee || me().id; touch(o);
    audit('إرسال نتيجة', o.id, 'إجابة نهائية مجانية وإغلاق الطلب'); push(`وصلتك إجابة خبير على طلبك ${o.id}`, o.id); render();
  },
  feePreview() { const f = +K.val('ctFee') || 0, el = document.getElementById('feePrev'); if (el) el.textContent = f ? `يدفع العميل ${money(f * (1 + VAT))} • عمولة المنصة ${money(f * commission())} • صافي المحامي ${money(f * (1 - commission()))}` : ''; },
  issueContract() {
    const o = K.cur(), scope = K.val('ctScope'), fee = +K.val('ctFee'), days = +K.val('ctDays');
    if (!scope || !(fee > 0) || !(days > 0)) return toast('أكمل نطاق العمل والأتعاب والمدة');
    o.contract = { scope, fee, days, issuedAt: now(), issuedBy: me().id, acceptedAt: null }; touch(o);
    audit('إصدار عقد', o.id, `أتعاب ${money(fee)} — ${days} يوم`); push(`صدر عقد طلبك ${o.id} — يرجى مراجعته واعتماده`, o.id);
    render(); toast('صدر العقد وأُشعر العميل');
  },
  approve() {
    const o = K.cur(); o.ceoApproved = true; o.status = 'IN_PROGRESS'; touch(o);
    audit('اعتماد بدء التنفيذ', o.id, 'CEO Gate'); push(`بدأ العمل على طلبك ${o.id}`, o.id); notifyStaff(o.assignee, `اعتُمد بدء التنفيذ للطلب ${o.id} — ابدأ العمل`, o.id); render();
  },
  deliver() {
    const o = K.cur(), files = [...document.getElementById('resFiles').files].map(f => f.name), note = K.val('resNote');
    if (!files.length && !note) return toast('أرفق ملف المخرجات أو اكتب ملاحظة');
    o.result = { files: [...(o.result ? o.result.files : []), ...files], note, at: now(), by: me().id };
    files.forEach(f => o.docs.push({ name: f, size: 0, at: now(), by: 'team' }));
    o.requests.filter(r => r.type === 'revision' && r.status === 'open').forEach(r => { r.status = 'done'; r.reply = 'تم تنفيذ التعديل ورفع النتيجة المحدثة.'; });
    o.status = 'READY_DELIVERY'; touch(o);
    audit('إرسال نتيجة', o.id, files.join('، ') || note); push(`نتيجة طلبك ${o.id} جاهزة للتحميل`, o.id); render();
  },
  reply(rid) {
    const o = K.cur(), r = o.requests.find(x => x.id === rid), v = K.val('ar_' + rid); if (!v) return toast('اكتب الرد أولاً');
    r.reply = v; r.status = 'done'; touch(o); audit('رد على تنبيه', o.id, `${REQ_T[r.type]}: ${v}`); push(`رد خبير على تنبيهك في الطلب ${o.id}`, o.id); render();
  },
  unlock(rid) {
    const o = K.cur(), r = o.requests.find(x => x.id === rid);
    o.uploadUnlocked = true; r.status = 'done'; r.reply = K.val('ar_' + rid) || 'تم فتح صلاحية رفع المستند لك.'; touch(o);
    audit('فتح صلاحية الرفع', o.id, ''); push(`فُتحت لك صلاحية رفع مستند في الطلب ${o.id}`, o.id); render();
  },
  cancelByAdmin(rid, ok) {
    if (!ok) return ask('اعتماد إلغاء الطلب بناءً على طلب العميل؟', () => K.cancelByAdmin(rid, true));
    const o = K.cur(), r = o.requests.find(x => x.id === rid);
    r.status = 'done'; r.reply = K.val('ar_' + rid) || 'تمت الموافقة على طلب الإلغاء.'; o.status = 'CANCELLED'; touch(o);
    audit('إلغاء طلب', o.id, 'بقرار الإدارة بناءً على طلب مستقل من العميل'); push(`تم إلغاء طلبك ${o.id} بناءً على طلبك`, o.id); notifyStaff(o.assignee, `أُلغي الطلب ${o.id} بقرار الإدارة`, o.id); render();
  },
  note() { const o = K.cur(), v = K.val('noteIn'); if (!v) return; o.internal.push({ text: v, by: me().name, at: now() }); touch(o); render(); },
  cpReply(id) {
    const c = S.complaints.find(x => x.id === id), v = K.val('cr_' + id); if (!v) return;
    c.reply = v; c.by = me().name; c.status = 'done'; push('تم الرد على ' + (c.type === 'complaint' ? 'شكواك' : 'اقتراحك'), c.orderId || null); render();
  },
  setRole(uid) {
    const u = user(uid), r = K.val('role_' + uid); if (r === u.role) return;
    audit('تغيير صلاحيات', '—', `${u.name}: ${ROLES[u.role]} ← ${ROLES[r]}`); u.role = r;
    if (LAWYER_ROLES.includes(r) && !u.specialties) { u.specialties = []; u.active = true; }
    render(); toast('تم تحديث الصلاحية');
  },
  toggleSpec(k) { const u = me(); u.specialties = u.specialties || []; u.specialties = u.specialties.includes(k) ? u.specialties.filter(x => x !== k) : [...u.specialties, k]; render(); },
  toggleAvail(uid) { const u = user(uid); u.active = u.active === false; audit('تغيير التوفر', '—', `${u.name}: ${u.active ? 'متاح' : 'غير متاح'}`); render(); },
  addLawyer() {
    const name = K.val('nlName'); if (!name) return toast('اكتب اسم المحامي');
    const specs = [...document.querySelectorAll('input[name=nlSpec]:checked')].map(x => x.value);
    const u = { id: nid('u'), name, role: K.val('nlType'), license: K.val('nlLic'), specialties: specs, active: true };
    S.users.push(u); audit('تغيير صلاحيات', '—', `إضافة ${name} بصفة ${ROLES[u.role]}`); render(); toast('أُضيف المحامي إلى الشبكة');
  },
  payout(oid) {
    const o = order(oid), e = earning(o); o.payout = { at: now(), by: me().name };
    audit('تحويل أتعاب', o.id, `${money(e.net)} إلى ${uname(o.assignee)}`); notifyStaff(o.assignee, `تم تحويل أتعابك عن الطلب ${o.id}: ${money(e.net)}`, o.id); render();
  },
  setCommission() { S.settings.commission = Math.min(100, Math.max(0, +K.val('comIn') || 0)); audit('تعديل العمولة', '—', `${S.settings.commission}%`); render(); toast('تم الحفظ'); },
  setDelay() { S.settings.delayHours = Math.max(1, +K.val('delayH') || 48); render(); toast('تم الحفظ'); },
  time(ms) { S.settings.offset = ms ? (S.settings.offset || 0) + ms : 0; render(); toast('الوقت التجريبي: ' + fdt(now())); },
  reset(ok) {
    if (!ok) return ask('إعادة ضبط جميع البيانات إلى البيانات التجريبية الأولية؟', () => K.reset(true));
    try { localStorage.removeItem(KEY); } catch (e) {}
    S = seed(); CV.screen = 'home'; AV.view = 'orders'; LV.view = 'home'; render(); toast('تمت إعادة الضبط');
  },
};

/* ================= مشترك ================= */
function showInvoice(id) {
  const o = order(id), p = o.payment, fee = o.contract.fee;
  modal(`<div class="invoice"><div class="row between"><h3 style="margin:0">🧾 فاتورة ضريبية مبسطة</h3><b class="num">${p.invoice}</b></div>
    <p class="small muted">خبير — المكتب الحقوقي الرقمي • ${fdt(p.at)}</p>
    <table><tr><td>العميل</td><td>${esc(S.client.name)} (${S.client.fileNo})</td></tr><tr><td>الطلب</td><td>${o.id}</td></tr>
    <tr><td>الخدمة</td><td>${esc(o.contract.scope.slice(0, 70))}…</td></tr><tr><td>المبلغ قبل الضريبة</td><td>${money(fee)}</td></tr>
    <tr><td>ضريبة القيمة المضافة 15%</td><td>${money(fee * VAT)}</td></tr><tr><td><b>الإجمالي</b></td><td><b>${money(p.amount)}</b></td></tr>
    <tr><td>وسيلة الدفع</td><td>${p.method}</td></tr></table>
    <button class="btn block" style="margin-top:14px" onclick="closeModal()">إغلاق</button></div>`);
}
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; });
function showInstall() {
  const standalone = window.matchMedia && matchMedia('(display-mode: standalone)').matches;
  modal(`<h3 style="margin-top:0">📲 تثبيت خبير كتطبيق</h3>
    ${standalone ? '<div class="banner ok">أنت تستخدم النسخة المثبتة من التطبيق.</div>' : ''}
    ${deferredPrompt ? '<button class="btn green block" onclick="doInstall()">تثبيت الآن</button>' : ''}
    <div class="stack" style="margin-top:12px">
      <div class="card"><h4>آيفون (Safari)</h4><div class="small">افتح موقع خبير ← زر المشاركة ⬆️ ← «إضافة إلى الشاشة الرئيسية».</div></div>
      <div class="card"><h4>أندرويد (Chrome)</h4><div class="small">افتح موقع خبير ← القائمة ⋮ ← «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية».</div></div>
      <div class="card"><h4>الكمبيوتر (Chrome / Edge)</h4><div class="small">أيقونة التثبيت في شريط العنوان، أو القائمة ← «تثبيت خبير».</div></div>
    </div>
    <p class="small muted">يظهر التطبيق بأيقونة خبير ويفتح بملء الشاشة دون شريط المتصفح، تمهيداً لإطلاقه في App Store وGoogle Play.</p>
    <button class="btn ghost block" onclick="closeModal()">إغلاق</button>`);
}
async function doInstall() { if (!deferredPrompt) return; deferredPrompt.prompt(); try { await deferredPrompt.userChoice; } catch (e) {} deferredPrompt = null; closeModal(); }
function modal(h) { document.getElementById('modalRoot').innerHTML = `<div class="overlay" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true">${h}</div></div>`; }
let askFn = null;
function ask(msg, fn) {
  askFn = fn;
  modal(`<h3 style="margin-top:0">تأكيد</h3><p>${esc(msg)}</p><div class="row"><button class="btn red" onclick="const f=askFn;askFn=null;closeModal();f&&f()">تأكيد</button><button class="btn ghost" onclick="closeModal()">تراجع</button></div>`);
}
function closeModal() { document.getElementById('modalRoot').innerHTML = ''; }
function toast(m) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }
function setPortal(p, fromHash) {
  PORTAL = ['client', 'lawyer', 'admin'].includes(p) ? p : 'client';
  if (!fromHash) { try { if (location.hash !== '#' + PORTAL) location.hash = PORTAL; } catch (e) {} }
  pushQueue = null; render(); scrollTo(0, 0);
}
function render() {
  purgeDrafts();
  document.getElementById('app').innerHTML = PORTAL === 'lawyer' ? renderLawyer() : PORTAL === 'admin' ? renderAdmin() : renderClient();
  document.querySelectorAll('#portalSeg button').forEach(b => b.classList.toggle('on', b.dataset.p === PORTAL));
  document.getElementById('clock').textContent = (S.settings.offset ? '⏩ وقت تجريبي: ' : '') + fdt(now());
  if (pushQueue) { const q = pushQueue; setTimeout(() => { if (pushQueue === q) { pushQueue = null; const t = document.querySelector('.push'); t && t.remove(); } }, 3800); }
  save();
}

document.documentElement.lang = 'ar'; document.documentElement.dir = 'rtl';
load();
window.addEventListener('hashchange', () => setPortal(location.hash.slice(1), true));
setPortal((location.hash || '').slice(1), true);
setInterval(() => { document.getElementById('clock').textContent = (S.settings.offset ? '⏩ وقت تجريبي: ' : '') + fdt(now()); }, 30000);
</script>
<script>
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
